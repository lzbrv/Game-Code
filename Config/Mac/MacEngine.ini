; ============================================================================
; Trace - Mac-only engine config.
;
; This is the ProjectPlatform layer of the Engine config hierarchy
; ({PROJECT}/Config/{PLATFORM}/{PLATFORM}{TYPE}.ini in the engine's
; Core/Public/Misc/ConfigHierarchy.h). It is read after Config/DefaultEngine.ini
; and ONLY when the platform is Mac: a Mac editor, a Mac -game run, a Mac
; package. Windows builds never read it. Put a setting here, not in
; DefaultEngine.ini, when its reason is Mac-only.
; ============================================================================

; ----------------------------------------------------------------------------
; A PACKAGED MAC BUILD MUST NOT SIGNAL ITS OWN AUDIO THREAD.
;
; When the audio render thread stalls (no output device, a Bluetooth device
; switch, a locked Mac), the engine's stall diagnostics dump that thread's
; callstack (AudioMixerSourceManager.cpp, DoStallDiagnostics -> LogCallstack).
; On a Mac that dump is a pthread_kill(SIGUSR2) aimed at the thread
; (ApplePlatformStackWalk.cpp, RaiseSIGUSR2ForThreadAndWait). Only
; PLCrashReporter handles SIGUSR2, and a packaged game installs it only when
; CrashReportClient is in the bundle (MacPlatformMisc.cpp, !WITH_EDITOR arm).
; Ours has none, so the signal's default action ends the process: no crash
; report, no log line, just "User defined signal 2".
;
; It stayed hidden while packages shipped no sound. With /Game/Trace/Audio
; cooked (DefaultGame.ini), a packaged Development build on a Mac with a stalled
; output device died 10-15 s after launch in 2 of 2 runs. With this line it ran
; the full 120 s. The editor never died, because it always installs the handler.
;
; What this switches off is one callstack in the stall log. The stall warning,
; the in-flight task list and the engine's recovery (swapping to a null device)
; still run.
;
; WHY IT IS IN THIS FILE. It was in DefaultEngine.ini until 2026-09-28, which
; also switched the stall callstacks off on Windows, where the dump is harmless
; and useful. [ConsoleVariables] is applied from the MERGED Engine config
; (ConfigCacheIni.cpp, ApplyCVarSettingsFromIni(TEXT("ConsoleVariables"),
; *GEngineIni, ...)), so this layer counts. Measured on a Mac -game run: with
; the line only here the log shows
;     LogConfig: Set CVar [[au.DumpCallstackOnStallDiagnostics:0]]
;     au.DumpCallstackOnStallDiagnostics = "false"   LastSetBy: SystemSettingsIni
; and with it nowhere, "true" / LastSetBy: Constructor. Check it on any build
; with the console command au.DumpCallstackOnStallDiagnostics (no value).
; ----------------------------------------------------------------------------
[ConsoleVariables]
au.DumpCallstackOnStallDiagnostics=0
