CHARACTER.MACE.ACTIVATED_DESC      = THROW A ROPED SPIKE. IT EMBEDS IN A WALL FOR 2S; PRESS AGAIN TO BE PULLED TO IT AT THE MOMENTUM CEILING. ANY MOVEMENT INPUT CANCELS. YOU CAN SHOOT AND BE SHOT WHILE PULLED.
CHARACTER.MACE.ACTIVATED_NAME      = SPIKE
CHARACTER.MACE.MOVEMENT            = HOLD V IN THE AIR TO SUSPEND FOR UP TO 1.25S. NO GRAVITY, LATERAL MOVE CAPPED AT 550. RELEASING V CANCELS INSTANTLY.
CHARACTER.MACE.NAME                = MACE
CHARACTER.MACE.PASSIVE             = +30% CORE MAGNET RADIUS. THE BASE IS 450, SO HERS IS 585.
CHARACTER.MORTIMER.ACTIVATED_DESC  = ONLY WHILE CARRYING THE CORE AND STOOD ON THE GROUND OR ON TOP OF AN OBJECT: A BLAST THAT KNOCKS EVERY NEARBY ENEMY AWAY FROM HIM. IT CANNOT MOVE A CORE CARRIER.
CHARACTER.MORTIMER.ACTIVATED_NAME  = QUAKE
CHARACTER.MORTIMER.MOVEMENT        = MANTLE. HE IS THE ONLY CHARACTER WHO CAN PULL HIMSELF UP ONTO A LEDGE OR THE TOP OF AN OBJECT, AND HIS REACH AND HEIGHT WINDOW ARE 30% MORE GENEROUS THAN THE OLD IN-GAME MANTLE.
CHARACTER.MORTIMER.NAME            = MORTIMER
CHARACTER.MORTIMER.PASSIVE         = HIS DASH COVERS ONLY TWO FIFTHS OF THE NORMAL DISTANCE AND RECHARGES A QUARTER SLOWER. IN EXCHANGE HE MAY CHARGE A CORE THROW FOR TWICE AS LONG AS ANYONE ELSE, THOUGH CHARGE BEYOND A NORMAL FULL ONE COUNTS FOR LESS - SO HE STILL THROWS IT FURTHER THAN ANYONE, JUST NOT DOUBLE.
CHARACTER.OYSTER.ACTIVATED_DESC    = LOB A JAR. ON LANDING IT DEALS 30 IN AN AREA AND PULLS NEARBY ENEMIES IN, THEN EXPLODES INTO POISON THE MOMENT THE PULL ENDS. ANY POISON YOU LAND HANDS E STRAIGHT BACK, SO THE 20S IS A CEILING, NOT A WAIT.
CHARACTER.OYSTER.ACTIVATED_NAME    = PICKLER
CHARACTER.OYSTER.MOVEMENT          = JUMPING WHILE STOOD ON ONE OF YOUR OWN JARS BREAKS IT AND BOOSTS YOU UPWARD.
CHARACTER.OYSTER.NAME              = OYSTER
CHARACTER.OYSTER.PASSIVE           = EVERY DASH LEAVES A POISON JAR, EVEN CARRYING THE CORE. AN ENEMY WHO TOUCHES ONE BREAKS IT: 3 DAMAGE EVERY 0.5S FOR 4S AND -30% SPEED. JARS LAST 4S, MAX 3. POISONING AN ENEMY RESETS YOUR E, EVERY TIME.
CHARACTER.ROCCO.ACTIVATED_DESC     = DASH ON ITS OWN COOLDOWN, LEAVING A RIPPLE FOR 4S. ANYONE ON EITHER TEAM CAN RIDE IT, INCLUDING THE CORE CARRIER, AND YOU CAN SHOOT WHILE RIDING.
CHARACTER.ROCCO.ACTIVATED_NAME     = RIPPLE
CHARACTER.ROCCO.MOVEMENT           = A VERY SMALL SECOND JUMP. THE POINT IS THE INSTANT MIDAIR DIRECTION CHANGE, NOT THE HEIGHT.
CHARACTER.ROCCO.NAME               = ROCCO
CHARACTER.ROCCO.PASSIVE            = HEADSHOT KILLS GIVE +3% SPEED FOR 3S. STACKS, AND EACH KILL EXTENDS THE WHOLE BOOST.
CHARACTER.ROXIE.ACTIVATED_DESC     = LOAD A MODDED CLIP: THE GUN GOES FULL AUTO AND FIRES 1.65X FASTER. ENDS AFTER ONE CLIP OR 5S, WHICHEVER COMES FIRST.
CHARACTER.ROXIE.ACTIVATED_NAME     = MODDED
CHARACTER.ROXIE.MOVEMENT           = V FIRES A WOBBLING ROCKET THAT THROWS HER BACKWARDS, FAST AND FAR. IT IS HARD TO AIM AND DEALS 100 ANYWHERE IT HITS. 35S COOLDOWN.
CHARACTER.ROXIE.NAME               = ROXIE
CHARACTER.ROXIE.PASSIVE            = JUMPS 15% HIGHER THAN EVERYONE ELSE.
CHARACTER.SLIMEBALL.ACTIVATED_DESC = THROW UP A WALL WHERE YOU ARE AIMING, FOR 4S. BULLETS PASS STRAIGHT THROUGH IT BUT NOBODY CAN SEE THROUGH IT, AND ENEMIES WALKING THROUGH ARE SLOWED 35%.
CHARACTER.SLIMEBALL.ACTIVATED_NAME = SLIMEWALL
CHARACTER.SLIMEBALL.MOVEMENT       = HOLD V TO STICK TO A WALL.
CHARACTER.SLIMEBALL.NAME           = SLIMEBALL
CHARACTER.SLIMEBALL.PASSIVE        = WHILE STUCK: FIRES 30% FASTER AND TAKES 30% LESS FROM BODY SHOTS AND FRONT KNIFE STABS. HEADSHOTS AND BACKSTABS STILL HURT IN FULL.
CHARACTER.X.ACTIVATED_DESC         = LOAD THE 5 BEES INTO YOUR GUN. YOUR NEXT FIVE BULLETS APPLY VULNERABLE AT NORMAL DAMAGE. THE BEES RESUME ORBITING ONCE ALL FIVE ARE FIRED.
CHARACTER.X.ACTIVATED_NAME         = STING
CHARACTER.X.MOVEMENT               = +15% SPEED WHILE ANY ENEMY IS VULNERABLE.
CHARACTER.X.NAME                   = X
CHARACTER.X.PASSIVE                = FIVE MECHANICAL BEES ORBIT YOU. AN ENEMY THEY TOUCH IS VULNERABLE FOR 2S AND TAKES +35% DAMAGE FROM EVERYTHING, +5% MORE PER EXTRA HIT UP TO FIVE. A NEW HIT RESETS THE TIMER.
