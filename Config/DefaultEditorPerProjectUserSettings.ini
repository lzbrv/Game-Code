; Trace - editor defaults for Play In Editor.
;
; Trace is a multiplayer-only game, so playing it offline tells you almost nothing:
; replication, prediction, the lag-compensated hitscan and the trail trip test all
; only exist once there is a server and at least one client. These defaults make
; the Play button spawn a real networked session every time, so nobody has to
; remember to change Net Mode before every test.
;
; These live in Config/ (committed) rather than Saved/ (gitignored) so every
; collaborator gets them on clone.
;
; To change them in the editor instead:
;   Editor Preferences > Level Editor > Play > Multiplayer Options
; Anything you change there is written to Saved/Config/<Platform>Editor/
; EditorPerProjectUserSettings.ini, which OVERRIDES this file for you locally.

[/Script/UnrealEd.LevelEditorPlaySettings]
; The editor instance is both server and client - one window hosts, the rest join.
; This is the mode that matches how you will actually playtest Trace (listen server),
; and it is the only mode available to a launcher-installed engine, which cannot
; build the dedicated server target. See docs/NETWORKING.md.
PlayNetMode=PIE_ListenServer

; One host + one joiner. Raise toward 10 to test a full 5v5; every extra client is
; a whole extra game instance, so start small.
PlayNumberOfClients=2

; All instances share one process: far faster to launch, and a single Output Log
; carries every instance's messages, which is what you want when debugging
; replication. Turn this OFF if you need to test true process isolation.
RunUnderOneProcess=True

; Windowed and offset so the client does not land exactly on top of the host.
ClientWindowWidth=1280
ClientWindowHeight=720
