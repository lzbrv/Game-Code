; ============================================================================
; Trace - SHIPPED video defaults (spec v11 s0/s1)
;
; This is the project layer of the GameUserSettings ini hierarchy:
;   Engine/Config/BaseGameUserSettings.ini
;   <Project>/Config/DefaultGameUserSettings.ini      <- this file, checked in
;   <Project>/Saved/Config/<Platform>/GameUserSettings.ini   <- the player's, written at runtime
; A player who has ever opened the VIDEO page has their own file and never sees
; these values again. This file only decides what a machine gets on the very first
; launch, in the fraction of a second before first-run auto-detect replaces it.
;
; DELETE Saved/Config/<Platform>/GameUserSettings.ini to genuinely start clean:
; that also clears bHasAutoDetected, so the hardware benchmark runs again.
;
; WHY THESE ARE THE VALUES THEY ARE.
; Spec v11 s0: "Nothing that costs frames may become the default without an
; auto-detect deciding it." The engine's own default is
; FQualityLevels::SetDefaults() = Epic, which is what this build has effectively
; been shipping. Everything below is therefore EQUAL TO OR CHEAPER THAN the
; current build; nothing here can make the frame more expensive than it is today.
;
; The class that reads all of this is UTraceGameUserSettings, wired up by
; Config/DefaultEngine.ini's [/Script/Engine.Engine] GameUserSettingsClassName.
; ============================================================================

; ----------------------------------------------------------------------------
; Scalability groups.
;
; Read by Scalability::LoadState(GGameUserSettingsIni) during FEngineLoop::PreInit
; and written back by Scalability::SaveState from UGameUserSettings::SaveSettings.
; The key names look like CVars but are plain ini keys - Scalability.cpp only ever
; uses them as strings.
;
; 2 = HIGH, one step below the engine default of Epic. High rather than Medium
; because Medium is a visible downgrade on a scene that is almost entirely
; emissive strips and a glossy floor, and because the benchmark is going to
; overwrite this within a second on a machine that cannot afford it.
;
; sg.FoliageQuality and sg.LandscapeQuality are set for completeness. This arena
; contains no foliage instance and no landscape actor, which is exactly why the
; VIDEO page does not offer rows for them.
; ----------------------------------------------------------------------------
[ScalabilityGroups]
; 100 = render at native. NOT 0: 0 is the engine's "defer to r.ScreenPercentage.Default"
; sentinel and would leave the VIDEO page's render-scale row with nothing concrete to
; show on a first launch.
sg.ResolutionQuality=100
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=2
sg.PostProcessQuality=2
sg.ShadowQuality=2
sg.GlobalIlluminationQuality=2
sg.ReflectionQuality=2
sg.TextureQuality=2
sg.EffectsQuality=2
sg.ShadingQuality=2
sg.FoliageQuality=2
sg.LandscapeQuality=2

; ----------------------------------------------------------------------------
; Engine-declared video settings.
;
; ResolutionSizeX/Y and FullscreenMode are DELIBERATELY ABSENT. Leaving them unset
; makes UGameUserSettings::ValidateSettings adopt the machine's own desktop
; resolution and GetDefaultWindowMode(), which is the right answer on every
; display, and keeps Scripts/run-client.sh's -ResX/-ResY/-windowed working: those
; are applied by PreloadResolutionSettings on top of whatever the ini says.
;
; FrameRateLimit 0 = unlimited. On macOS Metal this is NOT the whole story -
; present pacing survives it, and a perf table where every arm reads ~119.9 fps is
; that cap rather than a result. See spec v11 s4.
; ----------------------------------------------------------------------------
[/Script/Engine.GameUserSettings]
bUseVSync=False
bUseDynamicResolution=False
FrameRateLimit=0.000000

; ----------------------------------------------------------------------------
; The settings this project adds on top of UGameUserSettings.
;
; FieldOfView 95 is the number ATraceCharacter's constructor already hard-codes
; (TraceCharacterLayout::CameraFOV), so shipping this row changes nothing about
; how the game looks until a player moves it.
;
; bHasAutoDetected False is what ARMS first-run auto-detect. Do not ship it True.
; ----------------------------------------------------------------------------
[/Script/Trace.TraceGameUserSettings]
FieldOfView=95.000000
bHasAutoDetected=False
