; ============================================================================
; Trace - input configuration
;
; UInputSettings is UCLASS(config=Input), so this file - not DefaultEngine.ini -
; is where the engine actually reads these values from.
;
; Deliberately minimal. There are NO ActionMappings/AxisMappings here - those are
; the LEGACY input system, which this project does not use at all. This file points
; the engine at the Enhanced Input classes and sets engine-level input behaviour
; (capture mode, smoothing, console keys), and since D32-DINPUT it also carries the
; RawInput block at the bottom - a SECOND config=Input class, Windows-only, which is
; why it lives here rather than in DefaultEngine.ini.
;
; WHERE THE ACTIONS AND MAPPINGS ACTUALLY LIVE  (spec v17 section 6)
;   Content/Trace/Input/IA_*.uasset   the 16 input actions, and
;   Content/Trace/Input/IMC_Trace     the one mapping context,
; generated by Scripts/generate-input-assets.py. ATracePlayerController loads them
; when they are present and CONSTRUCTS EQUIVALENT OBJECTS IN C++ when they are
; not, so the game is playable either way and the log always says which path ran.
; `Trace.Input.VerifyAssets` in the console prints the whole comparison.
; (An older version of this comment said there were no input .uassets anywhere in
; the project, and cited a build contract that has since been retired. There are.)
;
; THE SET IS ALL-OR-NOTHING. TryAdoptInputAssets rejects the WHOLE set if one asset
; is missing or has the wrong ValueType, and the C++ fallback then builds all of
; them. So a checkout whose Content/Trace/Input predates the newest action plays
; correctly but on the fallback path - which is why regenerating the assets is part
; of adding an action, not an optional tidy-up afterwards.
;
; ============================================================================
; DEFAULT bindings for reference ONLY. NOTHING READS THIS BLOCK.
;
; The AUTHORITY at runtime is UTraceUserSettings: the action table in
; Source/Trace/Settings/TraceUserSettings.cpp for the shipped defaults, and
; Saved/Config/<Platform>/TraceUserSettings.ini for the player's own overrides.
; This list has been stale twice; if it disagrees with the table, the TABLE is
; right. `Trace.Settings.VerifyBinds` prints what the running game actually resolved.
;
;   Move (Axis2D) WASD        Look (Axis2D) Mouse XY
;   Jump Space                Crouch LeftCtrl           Dash LeftShift
;   Fire LMB                  Throw / pass core UNBOUND (LMB throws while carrying)
;   Melee RMB                 Pull core F
;   Parry Q + ThumbMouseButton
;   Weapon 1 (pistol) 1       Weapon 2 (SMG) 2
;   Ability E                 Ability secondary V       Reload R
;   Scoreboard Tab
;
; UP TO TWO KEYS PER ACTION (spec v28 section 3c). The .ini value is a
; comma-separated list, e.g. `ParryKeys=Q,ThumbMouseButton`; a single-key line from
; an older build still loads and leaves the second slot empty.
;
; TWO ACTIONS MAY SHARE ONE KEY when their states are exclusive (spec v28 section
; 3b) - throw-core and fire may sit on the same button, fire and pull-core may not.
; ETraceInputStates in TraceUserSettings.h is the whole rule.
;
; RIGHT MOUSE CARRIES TWO VERBS AND IS BOUND TO ONE ACTION. It is
; ETraceInputAction::Melee (spec v28 section 10). The Core pull OVERRIDES the melee
; from inside TraceMelee::HandleMeleeInput, and only while ATraceCore::CanPullNow is
; true - i.e. exactly while the HUD is drawing the pull circle. That precedence is a
; state test in the verb, NOT a second binding, which is why only one action names
; this key. Parry left this button in spec v28 section 3d and the "ParryPull" ->
; "ParryKeys" config-id migration is what takes it off a returning player too.
;
; Boost has been REMOVED from the game (spec v3 section 1), the SwapWeapon toggle
; was deleted in spec v15 section 5, and there is no longer any knife/gun swap at
; all (spec v28 section 10 - the knife is permanently in the off hand and keys 1
; and 2 select between the two GUNS), which is why none of them is listed here.
; ============================================================================

[/Script/Engine.InputSettings]
; --- Enhanced Input ---
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; Legacy scaling only applies to the old ActionMapping/AxisMapping path, which this
; project does not use. Off keeps Enhanced Input values unscaled and predictable.
bEnableLegacyInputScales=False

; --- Console ---
; Cleared first so we do not end up with a duplicate Tilde inherited from
; BaseInput.ini. Caret is added for ISO/DE-layout keyboards where Tilde is awkward.
-ConsoleKeys=Tilde
+ConsoleKeys=Tilde
+ConsoleKeys=Caret

; --- Mouse ---
; Smoothing and view acceleration are frame-rate dependent and make a hitscan
; shooter feel mushy; both off is the standard competitive baseline.
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bEnableFOVScaling=True
FOVScale=0.011110
DoubleClickTime=0.200000
bUseMouseForTouch=False
; Capture on launch and lock to the viewport: a mouselook game that lets the cursor
; wander onto a second monitor is unplayable, and this matters most on macOS.
bCaptureMouseOnLaunch=True
bDefaultViewportMouseLock=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; --- Window ---
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True

; --- Touch / mobile (unused; kept explicit so nothing is inherited) ---
bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=True
bEnableGestureRecognizer=False
bUseAutocorrect=False
DefaultTouchInterface=None

; ============================================================================
; D32-DINPUT - RawInput: generic HID gamepads on WINDOWS ONLY
;
; THE OWNER'S ASK: "Add direct input support not just xinput".
;
; WHAT THIS SECTION IS AND WHERE IT APPLIES
;   URawInputSettings is UCLASS(config=Input, defaultconfig), so this file is where
;   it reads from. The class only EXISTS when the RawInput module is loaded, which is
;   Win64 only (Trace.uproject pins the plugin reference with PlatformAllowList
;   Win64). On macOS this whole block is an unread section for a class that is not in
;   the build - inert, not broken. macOS has no DirectInput at all; the Mac pad path
;   is the engine's own HIDInputInterface in ApplicationCore and NOTHING here
;   reaches it.
;
; WHAT ENABLING THE PLUGIN ACTUALLY BUYS, ON WINDOWS
;   Unreal's built-in Windows pad path is XInput (the XInputDevice plugin, on by
;   default). XInput sees Xbox-style pads and essentially nothing else - a generic
;   USB/Bluetooth pad, an arcade stick, a wheel or a flight stick produces NO input at
;   all. RawInput reads those devices as raw HID and emits their buttons as keys
;   called GenericUSBController_Button1..N and their axes as
;   GenericUSBController_Axis1..24. bRegisterDefaultDevice below is what makes that
;   happen for any device with no explicit entry, so no per-device setup is needed to
;   get a device SEEN.
;
; WHAT IT DOES NOT BUY - READ THIS BEFORE ADDING A MAPPING
;   1. NO LAYOUT. Button 7 on one pad is button 11 on another. RawInput cannot tell
;      you which unlabelled button is "jump"; only the player's own report can. Run
;      `Trace.Input.Devices`, or read Saved/TraceInputDevices.txt, which the game
;      writes in every configuration including Shipping.
;   2. THE AXES DO NOT WORK ON THE DEFAULT KEYS, and this is a plugin defect rather
;      than a device problem. RawInput registers GenericUSBController_Axis1..24 with
;      the flag FKeyDetails::GamepadKey and NOT FKeyDetails::Axis1D
;      (Engine/Plugins/Experimental/RawInput/Source/RawInput/Private/RawInput.cpp).
;      FKey::IsAnalog() is therefore false for them. UPlayerInput::InputKey gates its
;      analog branch on IsAnalog(), and its non-analog branch switches on
;      IE_Pressed/IE_Repeat/IE_Released/IE_DoubleClick with NO default case - so the
;      IE_Axis event these keys arrive as is silently dropped and never reaches
;      Enhanced Input. Compare EKeys::Gamepad_LeftX, registered as
;      `GamepadKey | Axis1D`, which does work. BUTTONS are unaffected: they arrive as
;      IE_Pressed/IE_Released and behave normally.
;      THE FIX IS CONFIG, NOT ENGINE SOURCE. AxisProperties[].Key chooses which FKey
;      an axis emits on, so point the axes at engine keys that already carry Axis1D -
;      see the template below.
;   3. HOT-PLUG DOES NOT WORK FOR THE CATCH-ALL DEVICE, and this is the failure mode
;      most likely to be reported as "it just doesn't work". FRawInputWindows'
;      constructor registers the default device exactly once, and its
;      RegisterInputDevice returns INDEX_NONE unless a device matching the requested
;      HID usage is ALREADY CONNECTED at that instant. It asks for Generic Desktop /
;      Joystick (usage page 0x01, usage 0x04) first and only falls back to Generic
;      Desktop / Gamepad (0x05) if that returned INDEX_NONE. So:
;        * plug the device in BEFORE launching and it is registered;
;        * plug it in AFTER launching and nothing registers it, because there is no
;          re-registration path - only a reconnect path for a usage already registered;
;        * with a joystick present at launch, the 0x05 gamepad class is never asked
;          for at all, so a joystick and a HID gamepad cannot both be covered.
;      TELL PLAYERS TO CONNECT THE CONTROLLER FIRST, THEN START THE GAME. Note this is
;      the opposite of the Mac/Enhanced-Input side, where mid-session pairing is fine.
;   4. NOT TESTED. This project can only be built on macOS, where no DirectInput
;      device can exist. Every claim above is read out of the 5.8 engine source, not
;      observed on hardware. First-run failure modes to expect on Windows are named in
;      the D32-DINPUT report.
;
; DEPRECATION. RawInput.uplugin carries "DeprecatedEngineVersion": "5.8", so UBT
; prints one warning per build: "Project 'Trace' depends on plugin 'RawInput' which
; was deprecated in 5.8 and will soon be removed." It is a LogWarning in
; UEBuildPlugin.cs, not an error, and it does not fail the build. The plugin reference
; is marked Optional so the day the engine drops it the project still builds.
; ============================================================================

[/Script/RawInput.RawInputSettings]
; Handle any HID gamepad/joystick that has no explicit entry below. This is also the
; C++ default; stated here so it cannot drift silently.
bRegisterDefaultDevice=True

; ---------------------------------------------------------------------------
; PER-DEVICE MAPPING TEMPLATE - commented out on purpose.
;
; DO NOT UNCOMMENT SPECULATIVELY. The indices below are invented, and a wrong entry is
; worse than none: a device matching VendorID/ProductID takes this path INSTEAD of the
; generic one, so a bad entry turns a partly-working pad into a dead one.
;
; Fill it in from a real report. AxisProperties/ButtonProperties are positional - entry
; N configures the device's axis/button N - and Key is the FKey the value is emitted
; on. Pointing the sticks at Gamepad_LeftX/Y and Gamepad_RightX/Y is what routes
; around the missing-Axis1D defect described above AND makes the device usable by the
; existing controller bindings page, which speaks Gamepad_* keys.
;
; bGamepadStick=True rescales that axis from 0..1 to -1..1, which is what a centred
; stick needs. Leave it False for a trigger or a pedal.
;
; +DeviceConfigurations=(VendorID="0x046D",ProductID="0xC21F",AxisProperties=((bEnabled=True,Key=Gamepad_LeftX,bInverted=False,bGamepadStick=True,Offset=0.0),(bEnabled=True,Key=Gamepad_LeftY,bInverted=True,bGamepadStick=True,Offset=0.0),(bEnabled=True,Key=Gamepad_RightX,bInverted=False,bGamepadStick=True,Offset=0.0),(bEnabled=True,Key=Gamepad_RightY,bInverted=True,bGamepadStick=True,Offset=0.0)),ButtonProperties=((bEnabled=True,Key=Gamepad_FaceButton_Bottom),(bEnabled=True,Key=Gamepad_FaceButton_Right),(bEnabled=True,Key=Gamepad_FaceButton_Left),(bEnabled=True,Key=Gamepad_FaceButton_Top)))
; ---------------------------------------------------------------------------
