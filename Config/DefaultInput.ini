; ============================================================================
; Trace - input configuration
;
; UInputSettings is UCLASS(config=Input), so this file - not DefaultEngine.ini -
; is where the engine actually reads these values from.
;
; Deliberately minimal. There are NO ActionMappings/AxisMappings here - those are
; the LEGACY input system, which this project does not use at all. The only job of
; this file is to point the engine at the Enhanced Input classes and set
; engine-level input behaviour (capture mode, smoothing, console keys).
;
; WHERE THE ACTIONS AND MAPPINGS ACTUALLY LIVE  (spec v17 section 6)
;   Content/Trace/Input/IA_*.uasset   the 16 input actions, and
;   Content/Trace/Input/IMC_Trace     the one mapping context,
; generated by Scripts/generate-input-assets.py. ATracePlayerController loads them
; when they are present and CONSTRUCTS EQUIVALENT OBJECTS IN C++ when they are
; not, so the game is playable either way and the log always says which path ran.
; `Trace.Input.VerifyAssets` in the console prints the whole comparison.
; (An older version of this comment said there were no input .uassets anywhere in
; the project, and cited a build contract that has since been retired. There are.)
;
; THE SET IS ALL-OR-NOTHING. TryAdoptInputAssets rejects the WHOLE set if one asset
; is missing or has the wrong ValueType, and the C++ fallback then builds all of
; them. So a checkout whose Content/Trace/Input predates the newest action plays
; correctly but on the fallback path - which is why regenerating the assets is part
; of adding an action, not an optional tidy-up afterwards.
;
; ============================================================================
; DEFAULT bindings for reference ONLY. NOTHING READS THIS BLOCK.
;
; The AUTHORITY at runtime is UTraceUserSettings: the action table in
; Source/Trace/Settings/TraceUserSettings.cpp for the shipped defaults, and
; Saved/Config/<Platform>/TraceUserSettings.ini for the player's own overrides.
; This list has been stale twice; if it disagrees with the table, the TABLE is
; right. `Trace.Settings.VerifyBinds` prints what the running game actually resolved.
;
;   Move (Axis2D) WASD        Look (Axis2D) Mouse XY
;   Jump Space                Crouch LeftCtrl           Dash LeftShift
;   Fire LMB                  Throw / pass core UNBOUND (LMB throws while carrying)
;   Melee RMB                 Pull core F
;   Parry Q + ThumbMouseButton
;   Weapon 1 (pistol) 1       Weapon 2 (SMG) 2
;   Ability E                 Ability secondary V       Reload R
;   Scoreboard Tab
;
; UP TO TWO KEYS PER ACTION (spec v28 section 3c). The .ini value is a
; comma-separated list, e.g. `ParryKeys=Q,ThumbMouseButton`; a single-key line from
; an older build still loads and leaves the second slot empty.
;
; TWO ACTIONS MAY SHARE ONE KEY when their states are exclusive (spec v28 section
; 3b) - throw-core and fire may sit on the same button, fire and pull-core may not.
; ETraceInputStates in TraceUserSettings.h is the whole rule.
;
; RIGHT MOUSE CARRIES TWO VERBS AND IS BOUND TO ONE ACTION. It is
; ETraceInputAction::Melee (spec v28 section 10). The Core pull OVERRIDES the melee
; from inside TraceMelee::HandleMeleeInput, and only while ATraceCore::CanPullNow is
; true - i.e. exactly while the HUD is drawing the pull circle. That precedence is a
; state test in the verb, NOT a second binding, which is why only one action names
; this key. Parry left this button in spec v28 section 3d and the "ParryPull" ->
; "ParryKeys" config-id migration is what takes it off a returning player too.
;
; Boost has been REMOVED from the game (spec v3 section 1), the SwapWeapon toggle
; was deleted in spec v15 section 5, and there is no longer any knife/gun swap at
; all (spec v28 section 10 - the knife is permanently in the off hand and keys 1
; and 2 select between the two GUNS), which is why none of them is listed here.
; ============================================================================

[/Script/Engine.InputSettings]
; --- Enhanced Input ---
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; Legacy scaling only applies to the old ActionMapping/AxisMapping path, which this
; project does not use. Off keeps Enhanced Input values unscaled and predictable.
bEnableLegacyInputScales=False

; --- Console ---
; Cleared first so we do not end up with a duplicate Tilde inherited from
; BaseInput.ini. Caret is added for ISO/DE-layout keyboards where Tilde is awkward.
-ConsoleKeys=Tilde
+ConsoleKeys=Tilde
+ConsoleKeys=Caret

; --- Mouse ---
; Smoothing and view acceleration are frame-rate dependent and make a hitscan
; shooter feel mushy; both off is the standard competitive baseline.
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bEnableFOVScaling=True
FOVScale=0.011110
DoubleClickTime=0.200000
bUseMouseForTouch=False
; Capture on launch and lock to the viewport: a mouselook game that lets the cursor
; wander onto a second monitor is unplayable, and this matters most on macOS.
bCaptureMouseOnLaunch=True
bDefaultViewportMouseLock=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; --- Window ---
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True

; --- Touch / mobile (unused; kept explicit so nothing is inherited) ---
bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=True
bEnableGestureRecognizer=False
bUseAutocorrect=False
DefaultTouchInterface=None
