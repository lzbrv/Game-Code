; ============================================================================
; Trace - input configuration
;
; UInputSettings is UCLASS(config=Input), so this file - not DefaultEngine.ini -
; is where the engine actually reads these values from.
;
; Deliberately minimal. There are NO ActionMappings/AxisMappings here and no input
; .uassets anywhere in the project: every UInputAction and the single
; UInputMappingContext are constructed in C++ by ATracePlayerController and
; registered through UEnhancedInputLocalPlayerSubsystem::AddMappingContext.
; The only job of this file is to point the engine at the Enhanced Input classes
; and set engine-level input behaviour.
;
; Bindings for reference (authoritative source is ATracePlayerController):
;   Move (Axis2D) WASD | Look (Axis2D) Mouse XY | Jump Space | Fire LMB
;   Pass RMB | Dash Left Shift | Parry Q | Scoreboard Tab
; Parry is carrier-only (spec v3 section 3). Boost has been REMOVED from the game
; (spec v3 section 1), which is why no boost bind is listed here.
; ============================================================================

[/Script/Engine.InputSettings]
; --- Enhanced Input ---
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; Legacy scaling only applies to the old ActionMapping/AxisMapping path, which this
; project does not use. Off keeps Enhanced Input values unscaled and predictable.
bEnableLegacyInputScales=False

; --- Console ---
; Cleared first so we do not end up with a duplicate Tilde inherited from
; BaseInput.ini. Caret is added for ISO/DE-layout keyboards where Tilde is awkward.
-ConsoleKeys=Tilde
+ConsoleKeys=Tilde
+ConsoleKeys=Caret

; --- Mouse ---
; Smoothing and view acceleration are frame-rate dependent and make a hitscan
; shooter feel mushy; both off is the standard competitive baseline.
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
bEnableFOVScaling=True
FOVScale=0.011110
DoubleClickTime=0.200000
bUseMouseForTouch=False
; Capture on launch and lock to the viewport: a mouselook game that lets the cursor
; wander onto a second monitor is unplayable, and this matters most on macOS.
bCaptureMouseOnLaunch=True
bDefaultViewportMouseLock=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; --- Window ---
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True

; --- Touch / mobile (unused; kept explicit so nothing is inherited) ---
bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=True
bEnableGestureRecognizer=False
bUseAutocorrect=False
DefaultTouchInterface=None
