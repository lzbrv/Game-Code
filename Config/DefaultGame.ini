; ============================================================================
; Trace - project & gameplay configuration
;
; Anything whose UCLASS declares `config=Game` is read from this file. That
; includes UTraceSettings (UCLASS(config=Game, defaultconfig)) - its tunables are
; at the bottom of this file, NOT in DefaultEngine.ini.
; ============================================================================

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=B6EF84B0-ACD0-4545-A258-1E680F1C21CE
ProjectName=Trace
ProjectVersion=0.1.0
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "Trace")
Description=5v5 arena prototype. One shared Core, an invulnerable carrier laying a lethal trail, and dash as the only counterplay. Server-authoritative with client-side prediction and server-side rewind.
CompanyName=
bShouldWindowPreserveAspectRatio=True
bUseBorderlessWindow=False
bStartInVR=False
bAllowWindowResize=True
bAllowClose=True
bAllowMaximize=True
bAllowMinimize=True

; ----------------------------------------------------------------------------
; Session sizing - 5v5 plus a couple of spectator slots.
; UTraceSettings.PlayersPerTeam is the gameplay-side team cap; this is the
; connection-side cap the engine enforces at login. Keep them consistent:
; MaxPlayers should be at least PlayersPerTeam * 2.
; ----------------------------------------------------------------------------
[/Script/Engine.GameSession]
MaxPlayers=10
MaxSpectators=2
MaxSplitscreensPerConnection=1
bRequiresPushToTalk=True

; ----------------------------------------------------------------------------
; Packaging / cooking
;
; DirectoriesToAlwaysCook is load-bearing, not decoration. Every visual in this
; project is an /Engine/BasicShapes mesh. Constructor-time FObjectFinder refs are
; followed by the cooker, but any runtime LoadObject path is NOT - it would return
; nullptr in a packaged build. Cooking the whole directory makes that class of bug
; impossible regardless of how a mesh gets referenced.
; ----------------------------------------------------------------------------
[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
UsePakFile=True
bCompressed=True
bSkipEditorContent=False
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+MapsToCook=(FilePath="/Game/Maps/Arena")

; ============================================================================
; UTraceSettings - runtime gameplay tuning (Project Settings > Game > Trace Gameplay)
;
; These are the contract defaults written out explicitly so the team can retune
; the whole game without recompiling. They must stay in sync with the C++
; defaults in TraceSettings.h; where they differ, THIS FILE WINS at runtime.
;
; *** IF YOU CHANGE A DEFAULT IN TraceSettings.h, CHANGE IT HERE TOO. ***
; Every key below is loaded over the top of the C++ initialiser at startup, so a
; header-only edit does nothing at runtime. This has already caught somebody out
; once (HitscanRange).
;
; EDITING AT RUNTIME: you do not need this file. Project Settings > Game >
; "Trace Gameplay" edits the UTraceSettings CDO in place, which is the object
; UTraceSettings::Get() returns, so a change lands on the next frame WITH PIE
; STILL RUNNING - no restart, no rebuild. The panel writes back here when you
; save. See the LIVE EDITING block at the top of TraceSettings.h for the one
; family of values that needs a code hook instead (the engine-owned walk speed).
; ============================================================================
; ============================================================================
; ATraceGameMode - the RULES that are enforced server-side.
;
; This block is new, and it exists because of a bug class this project has hit
; more than once: a value that lives in TWO places, where the ini wins and the
; header is what everybody reads.
;
; ATraceGameMode::RespawnDelay is the value that actually schedules a respawn.
; UTraceSettings.RespawnDelay (further down) is only the HUD's fallback
; countdown. Spec v4 section 5 moves the respawn from 3s to 2s, so BOTH have to
; move, and pinning the enforced one here means the change cannot be undone by
; somebody editing only a header.
;
; NOTE the warning in DefaultEngine.ini about not adding a
; [/Script/Trace.TraceGameMode] block THERE: that is about GameStateClass /
; PlayerStateClass / DefaultPawnClass / HUDClass, which are NOT config-marked on
; AGameModeBase and so cannot be set from any ini. It does not apply to the
; properties below, every one of which is UPROPERTY(config) on ATraceGameMode
; and is therefore loaded from this file. Do not add class overrides here.
; ============================================================================
[/Script/Trace.TraceGameMode]
; Spec v4 section 5: 3.000000 -> 2.000000. THE ENFORCED RESPAWN TIME.
; Keep equal to UTraceSettings.RespawnDelay below, or the death panel's countdown
; disagrees with the game for the frame or two before the replicated deadline
; arrives.
RespawnDelay=2.000000

; HALF LENGTH - spec v10 section 7, verbatim: "Half timers 10 -> 8 minutes".
;
; THE ENFORCED LENGTH OF ONE HALF, in seconds. A match is HalvesPerMatch of these, so
; 480 makes a full match 16 minutes of running clock plus half time, down from 20.
;
; THIS KEY DID NOT EXIST BEFORE v10 and its absence was the whole hazard: the property
; is UPROPERTY(config) on ATraceGameMode with a 600 literal in TraceGameMode.h, so with
; no key here the header WAS the shipped value and there was nothing in this file that
; even hinted a half had a length. The house rule is that the ini wins and the ini is
; where a value is read from, so the number now lives here. If somebody changes the
; header literal and not this key, this key still wins - which is the point.
;
; Trace.Match.HalfSeconds (ATraceGameMode's own test hook) overrides it at runtime for
; a single match and does not write back here.
HalfDuration=480.000000

[/Script/Trace.TraceSettings]

; --- Match ---
; MatchDuration WAS HERE AND HAS BEEN DELETED along with the property. The match is
; two halves now (spec §1) and ATraceGameMode::HalfDuration
; ([/Script/Trace.TraceGameMode]) is the enforced length of each; nothing in the
; rules ever read MatchDuration.
;
; ScoreToWin IS GONE, key and property both (spec v4 section 6: "Remove score to
; win 5 - Keep the match timer as the win condition"). ATraceGameMode::
; bEndMatchAtScoreToWin, the switch that consumed it, is deleted with it. The two
; ways a match can end now are the clock and MercyRuleLead below - nothing else.
PlayersPerTeam=5
MinPlayersToStart=2
; Spec v4 section 5: 3.000000 -> 2.000000, matching the ENFORCED value in
; [/Script/Trace.TraceGameMode] above. This one is only a client-side fallback for
; the death panel's countdown before the authoritative deadline in
; ATracePlayerState has replicated. Keep them equal.
RespawnDelay=2.000000
WarmupDuration=5.000000

; MERCY RULE - spec v4 section 6, new. The match ends the moment one team leads by
; this many points, and that team wins. 0 disables it and leaves the clock as the
; only win condition. It is a LEAD, not a score: 9-1 ends it, 12-6 does not.
MercyRuleLead=8

; DEFERRED HALF TIME / FULL TIME - spec v9 section 11, new. Verbatim: "Change halftime to
; trigger after the time runs out and the current play ends, so that it doesn't cut people
; off in the middle of a run E.g. the ball drops in game mode b, any turnover of the core
; happens between teams, or a goal is scored, then half time triggers."
;
; With this on, the half's clock expiring does not end the half. It ARMS the whistle: the
; clock shows 0:00, the HUD says HALF ENDS AT NEXT DEAD BALL, and play carries on until a
; goal, a turnover BETWEEN THE TEAMS, or (mode B) the Core coming down. A within-team pass
; is not a break and play continues - that is the spec's stated assumption. The same rule
; applies to full time.
;
; False restores the pre-v9 behaviour exactly: the period ends on the tick the clock does.
bDeferPeriodEndToPlayBreak=True
;
; THE STALEMATE GUARD RAIL. Seconds a pending whistle will wait for a dead ball before
; ending the period anyway. 0 disables the cap - DO NOT SHIP IT AT 0: two teams that
; neither score nor turn the Core over would play past full time forever, and a stalemate
; is exactly the state in which nobody wants to be the one to concede possession.
PeriodEndMaxDeferSeconds=60.000000

; DEFAULT BOT DIFFICULTY - spec v9 section 9, verbatim: "Set default startup bot
; difficulty to normal". WAS ABSENT FROM THIS FILE ENTIRELY, which meant the header
; literal (Easy) was the shipped default and there was nothing here to find when somebody
; went looking for it. Pinned now, and this line WINS over the header.
;
; This is the fallback for a DIRECT LAUNCH into the arena with no travel URL. The title
; screen has its own default - TraceDifficulty::Default in Source/Trace/UI/
; TraceMatchOptions.h - and it writes "?difficulty=" onto the URL, which outranks this.
; Both have to say Normal.
BotDifficulty=Normal

; --- Scoring mode: the A/B toggle (spec v4 section 7) ---
; ScoringMode enumerators: EndzoneStatusCore | ThrownCoreAndGoals.
;   EndzoneStatusCore   mode A, the shipped game. Endzones spanning the full field
;                       width, the Core is a STATUS, LMB starts the hover-pass.
;   ThrownCoreAndGoals  mode B. Discrete goals, the Core is a physical object, LMB
;                       THROWS it, first contact picks it up.
; DEFAULTS TO A: mode A is the shipped game and must not regress. The main menu
; writes "?mode=a|b" onto the travel URL, which overrides this for one session;
; this key is what a direct launch straight into the arena plays.
; LATCH IT AT MATCH START - it changes what the Core IS, so flipping it mid-match
; is a rules change in mid-air, not a live retune.
ScoringMode=EndzoneStatusCore
; Goal geometry, mode B only. Width is a fraction of the FULL field width, so it
; follows the map if the field is resized. At 0.208300 that is a 2000uu mouth on the
; 9600uu field (spec v5 section 4, "decrease the size of the goal").
;
; SPEC v6 SECTION 4.3 CHANGED WHAT THESE TWO MEAN. "Raise the goals 1.5x player height
; from the ground, place them into the back walls, and make them circular." The goal is
; now a CIRCLE set into the back wall, so:
;   GoalWidthFieldFraction  is the ring DIAMETER. 2000uu across, unchanged in value and
;                           very nearly unchanged in meaning.
;   GoalHeightUU            no longer sizes anything about the goal - a circle has one
;                           dimension. It is now the GOAL APPROACH RAMP height, the
;                           run-up that makes carrying the Core through a raised hoop
;                           possible at all; without it a jump apex falls ~50uu short of
;                           the mouth and only throwing could ever score. Clamped to one
;                           step below the hoop, so at 440 the clamp wins; lower it to
;                           make carry-ins harder, 0 removes the ramp entirely.
; The 1.5 player heights is applied to the BOTTOM of the hoop, not its centre, and that
; is a deliberate deviation: a 1000uu radius about a 264uu centre would bury 736uu of the
; hoop under the floor and the goal would not be raised off the ground at all, which is
; the one thing the instruction asked for. Dial: GoalRingRaisePlayerHeights on the arena
; builder. The resolution is logged at Display every build.
; Mode A is untouched by this - its endzones span the full width by design, and the mode
; A end wall is still the solid slab (the perforated wall is built for mode B only).
GoalWidthFieldFraction=0.208300
GoalHeightUU=440.000000

; --- Bots (singleplayer) ---
; bFillTeamsWithBots tops BOTH teams up to PlayersPerTeam, so one human gets a
; real 5v5: 1 human + 4 AI vs 5 AI. Turn it off here for a humans-only session,
; or per-session with the URL option "?bots=0" (which always wins over this).
;
; BotsPerTeam=-1 means "however many it takes to reach PlayersPerTeam". That is
; a target ROSTER size rather than a bot count, which is what makes the fill
; self-correcting: a second human joining evicts a bot instead of making 11.
;
; SEVEN DEAD BOT KEYS DELETED THIS PASS, with their properties: BotReactionTime,
; BotAimErrorDegrees, BotAggression, BotDecisionInterval, BotSightRange,
; BotPreferredCombatRange and BotPassChance. ATraceBotController read none of them
; and UI/TraceMatchOptions.cpp stopped writing them; they were sliders that moved
; nothing, and two of them ("Preferred Combat Range", "Pass Chance") are exactly
; what a designer reaches for when bots hold the wrong range or never pass.
;
; The live knobs are the three FTraceBotProfile blocks (BotEasy / BotNormal /
; BotHard, 21 values each) defined in UTraceSettings, selected by BotDifficulty
; or by "?difficulty=easy|normal|hard" on the travel URL that the title screen
; writes.
;
; BotTrailDashRange must stay well under the dash's own reach, DashSpeed *
; DashDuration = 3000 * 0.18 = 540uu, or the dash stops short of the trail and
; the signature kill never lands. 420 is 78% of it.
bFillTeamsWithBots=True
BotsPerTeam=-1
MaxBots=16
BotTrailDashRange=420.000000

; BOT-SIDE MIRRORS OF RULE VALUES. These are not independent knobs: the bots run a
; shadow copy of the cooldown clocks so they can plan, and if a mirror disagrees
; with the rule the bots believe they have an ability they do not. Keep each one
; equal to the movement value it names.
;   BotDashCooldownSeconds  <-> DashCooldown   (3.5)
;   BotSlideHoldSeconds     <-> SlideDuration  (1.8, held slightly short at 1.6)
;   BotPassHoldSeconds      <-> PassHoldSeconds     (0.50)
;   BotPassCooldownSeconds  <-> PassCooldownSeconds (2.00, held at 2.30)
; BotBoostCooldownSeconds was here and is DELETED with the boost (spec v3 §1).
; The stuck-recovery job it was doing for a navmesh-less AI is now BotStuckJumpSeconds
; (default 1.30) - a plain jump, which clears the low neon trim that causes most
; wedges. Left at its header default; raise it if bots look twitchy on the new
; corner banks, lower it if they grind along a riser.
BotDashCooldownSeconds=3.500000

; A bot releases crouch after exactly BotSlideHoldSeconds, so this is the real
; length of every bot slide. At the old 0.70 against the new 1.8s SlideDuration
; every bot slide died inside the commit window and the longer slide could not be
; observed in a bot match at all. 1.60 lets it run essentially to its duration.
BotSlideHoldSeconds=1.600000

; BotTrailMinPointLifeRemaining discards the OLDEST end of the trace as "not worth
; running at". SPEC v7 §1 changed what that can mean: points no longer expire by age,
; so the old "seconds of life left" test became unsatisfiable - for a stationary
; carrier EVERY point is older than any age cutoff, and the bots would have discarded
; the entire trace and never planned an intercept. It is now a DISTANCE margin from
; the tail: this x WalkSpeed = 0.40 x 800 = 320uu skipped, which against the 1200uu
; TrailMaxLengthUU is the same calibrated oldest-~25% this number has always meant.
; Still a fraction of the trace written as an absolute - if TrailMaxLengthUU moves,
; move this with it.
BotTrailMinPointLifeRemaining=0.400000

; --- Combat ---
; DAMAGE IS POSITIONAL NOW (spec §6): head 100 / body 40 / legs 25, three body
; shots to kill at 100 health. Those three numbers live in UTraceDamageSettings
; ([/Script/Trace.TraceDamageSettings]), which is the single definition shared by
; the client's predicted trace and the server's rewound one.
;
; HitscanDamage and HeadshotMultiplier were the old flat-damage model and are
; READ BY NOTHING. Deleted rather than zeroed, so nobody retunes a dead knob and
; wonders why the game ignores them.
MaxHealth=100.000000

; --- HEALTH REGENERATION (spec v13 §1) IS NOT IN THIS SECTION ------------------------
; It is in [/Script/Trace.TraceHealthSettings], at the bottom of this file.
;
; *** THE TWO KEYS THAT WERE HERE - HealthRegenDelaySeconds AND HealthRegenPerSecond -
; *** ARE DELETED. They were never read by anything. ***
;
; Both blocks shipped in this same file for one pass, with the same numbers in them:
; this section's pair on [/Script/Trace.TraceSettings], and bRegenEnabled /
; RegenDelaySeconds / RegenRatePerSecond on [/Script/Trace.TraceHealthSettings]. The
; health component reads the SECOND one and only the second one, so retuning the delay
; here moved nothing at all and reported no error anywhere - the ini key existed, the
; property existed, the spelling was right, and there was simply no reader on this end.
;
; Trace.DumpSettings now prints the regen numbers by reading the health page directly,
; so what it shows is what the running game resolved. Do not re-add keys here.

; Spans the 33600 x 9600 arena's 34944uu diagonal (spec v4 section 3 lengthened the
; field from 24000 to 33600 for the 3.5:1 ratio). 28000 was sized for the OLD
; 24000-long field and fell 6944uu SHORT of the new diagonal: a shot down the spine
; expired in mid-air short of a target the player could plainly see. Bots are
; unaffected either way - their MaxEngagementRange caps at 6000 (Hard).
HitscanRange=36000.000000
; FireInterval is SECONDS BETWEEN SHOTS, i.e. 1/rate - a BIGGER number is a SLOWER
; gun.
;
; 0.160000 -> 0.400000 THIS PASS. Spec v5 section 5, verbatim: "Change the gun's
; firerate to be 150 rounds per minute, or whatever the equivalent is for this
; framework". 60/150 = 0.40s, i.e. 2.5 shots/sec, down from 6.25 (375 RPM).
;
; THIS KEY IS THE ONE THAT DECIDES. It is layered over the C++ initialiser in
; TraceSettings.h at startup, so editing only the header would have changed nothing
; at runtime. Both were moved; read it back from a running game with
; Trace.DumpSettings, which prints the interval AND the RPM it works out to.
;
; What it costs, stated where it is set:
;   * three body shots (40 each) = 0.80s of sustained fire on target, up from 0.32s;
;   * a head shot (100) still kills in one, so aiming high is now most of the gun;
;   * bot bursts (0.20-0.38s) now hold exactly ONE round instead of two or three, so
;     bot damage per engaged second roughly halves. The bot profiles are deliberately
;     NOT retuned in the same pass - the Easy baseline was measured, and moving both
;     at once makes the next measurement uninterpretable.
FireInterval=0.400000

; --- Upwards recoil (spec v5 section 6, new) ---
; Verbatim: "Add upwards recoil, mimicking 100 upwards recoil from destiny 2".
; A recoil-DIRECTION stat of 100 in Destiny 2 means the kick is purely vertical, so
; this model has a pitch term and no yaw term at all - not even one defaulted to
; zero, for the same reason SpreadDegrees was deleted rather than zeroed.
;
; The kick is applied to the LOCAL player's control rotation AFTER the shot's
; direction has been sampled and sent, so the round that caused it still goes exactly
; where the crosshair was, and the server is told a direction rather than a rotation -
; there is no recoil state on the wire and nothing for the two machines to disagree
; about. Bots are excluded: their control rotation is overwritten every frame by the
; aim slew, so a kick would be erased before it did anything.
;
;   PitchPerShot    degrees the first round of a burst kicks. ~70uu of vertical travel
;                   per 4000uu of range, against a 176uu capsule.
;   Growth          fraction added per further consecutive shot: 0.80, 0.94, 1.09...
;   MaxPitch        ceiling on un-recovered climb. The kick is truncated at it, so the
;                   view never overshoots and snaps back.
;   RecoveryDelay   MUST BE AT OR ABOVE FireInterval (0.40) or recovery undoes each
;                   kick between shots and the gun never climbs.
;   RecoverySpeed   proportional return, per second. Decelerates as it lands.
;   RecoveryFloor   deg/s floor under it, because a proportional return has an
;                   infinite tail and would leave a fraction of a degree on the view.
;   BurstReset      gap after which the GROWTH resets. Keep above FireInterval.
;   Compensation    pulling down during recovery cancels an equal part of the pending
;                   return, so a player's own correction is not paid back to them as a
;                   downward kick. This is the difference between recoil you can fight
;                   and recoil that fights back.
bRecoilEnabled=True
RecoilPitchPerShot=0.800000
RecoilPitchGrowthPerShot=0.180000
RecoilMaxPitchDegrees=6.000000
RecoilRecoveryDelaySeconds=0.450000
RecoilRecoverySpeed=6.000000
RecoilRecoveryMinRateDegrees=4.000000
RecoilBurstResetSeconds=0.750000
bRecoilPlayerCompensationCancels=True
bFriendlyFire=False
; SpreadDegrees WAS HERE AND HAS BEEN DELETED with its property. Spec §6: "There is
; no movement inaccuracy. Set spread to 0." UTraceWeaponComponent::FireOnce does not
; roll a cone at all - the shot IS the aim ray - so the knob was describing code that
; no longer exists.

; --- Movement ---
; The carrier is slightly FASTER than everyone else (1.08x): the carrier cannot
; shoot and is hunted by five people, so the speed edge is what makes carrying
; playable. Dash covers 3000 * 0.18 = 540 uu.
;
; The dash is CHARGED, not timed. Everyone holds BaseDashCharges; the Core carrier
; holds one more for as long as they carry it, and the pool refills one charge at a
; time, each on DashCooldown measured from the dash that spent it. Contract §5.
;
; Crouch is context-sensitive: on the ground it slides, in the air it zeroes positive
; Z velocity (a fast-fall). BOOST HAS BEEN REMOVED FROM THE GAME (spec v3 §1) - its
; bind, its settings and its bot usage are all gone.
;
; WalkSpeed is the ONE value on this page that engine code owns a copy of
; (UCharacterMovementComponent::MaxWalkSpeed, which the physics step clamps
; against). UTraceSettings::ApplyLiveMovementTuning re-pushes it to every live pawn
; whenever the Project Settings panel is edited, so it still retunes without
; restarting PIE - but it is the reason that function exists.
;
; 820.000000 -> 800.000000 (spec v4 section 5). THIS KEY IS THE ONE THAT DECIDES:
; it is layered over the C++ initialiser at startup, so editing only TraceSettings.h
; would have changed nothing at runtime. There is a THIRD copy in
; UTraceCharacterMovementComponent's constructor which seeds MaxWalkSpeed for the
; frames before BeginPlay overwrites it from here; it is not authoritative but should
; be moved with these two. Verify with Trace.DumpSettings in a running game, which
; prints both the table value and every live component's MaxWalkSpeed.
WalkSpeed=800.000000
; SPEC v13 §3, verbatim: "Update carrier speed to match the new knife speed."
; 1.300000 -> 1.220000. THE PARITY THE USER ASKED FOR TWICE IS NOW CLOSED.
;
; The whole reason this key was ever 1.30 is an older request to "increase core
; carrier speed to match knife speed". v12 §3 then cut the knife to 1.22 and
; deliberately left this alone, flagging it - so for one pass the CARRIER was the
; faster of the two (1.30 vs 1.22, +6.6%) and a defender who drew the knife to chase
; a carrier could not run them down in a straight line. That is the break this line
; resolves. 800 x 1.22 = 976 uu/s, the same speed as a knife carrier.
;
; *** THIS VALUE TRACKS KnifeMoveSpeedMultiplier, further down this file. They are two
; *** keys because they multiply different things and a designer must be able to break
; *** parity on purpose - but if the knife is retuned and this is not, the same break is
; *** back. Trace.DumpSettings prints both multipliers AND both resulting speeds on one
; *** line and says MATCHED or BROKEN; Trace.VerifyKnobs prints the pair adjacent.
;
; They do not stack. A carrier holding the knife gets this multiplier only, because
; TraceMelee::ShouldUseKnifeMovementProfile returns false for a carrier (the knife is
; stowed, not active). With both at 1.22 that clause changes no speed today, but it
; must stay: it is what stopped 1.30 x 1.22 = 1.59x and it is the reason parity means
; one number rather than two multiplied together.
CarrierSpeedMultiplier=1.220000
DashSpeed=3000.000000
DashDuration=0.180000
; 4.0 -> 3.5. Keep BotDashCooldownSeconds above equal to this.
DashCooldown=3.500000
BaseDashCharges=1
CarrierExtraDashCharges=1
; Spec v3 §2.4, "transitions preserve velocity". A dash used to end by dumping the
; pawn at exactly walking pace - the most visible reset in the kit. The surplus is
; handed back as real overspeed and then bleeds off through GroundOverspeedFriction,
; so it cannot become permanent free speed.
DashExitSpeedMultiplier=1.250000
; SPEC v7 §5 made the dash a true 3D ray, so a straight-up dash exists - and the
; air-strafe cap does NOT bound it, being planar by construction. Unclamped a vertical
; dash was 540uu on rails plus 3000uu/s of exit velocity (~4592uu of coast), straight
; through the arena's 1640uu ceiling. As a multiple of JumpZVelocity: at 1.0 a dash
; hands back at most one jump's worth of climb, so straight up totals ~749uu once, then
; a fall, with the next dash a full cooldown away. DOWNWARD exit Z is untouched by this
; - a dive is not a climb.
DashExitVerticalSpeedMultiplier=1.000000

; AIR CONTROL - Source/Quake air acceleration (spec v3 §2.1).
; The movement component projects the current velocity onto the wish direction and
; only tops it up to AirAccelerationCap ALONG that direction. Input perpendicular to
; travel therefore ROTATES the velocity vector at essentially constant magnitude,
; which is what "player retains full control authority to redirect velocity in air"
; asks for, and is why this must not be implemented as a lerp toward the input dir.
;   AirMaxWishSpeed     the air-strafe dial. Source ships the equivalent of ~57; 160
;                       is deliberately higher because the notes ask for strafing to
;                       be MORE effective in mid air, not less.
;   AirAcceleration     how fast the cap is reached. 8000 uu/s^2 is ~133 uu/s per
;                       60Hz frame, so the cap is essentially per-frame.
;   MaxAirSpeed         ceiling on what air INPUT can build to. Speed carried in from
;                       a dash or slide is never clamped - clamping it is the
;                       "state transitions reset velocity" complaint in §2.4.
;   AirFriction         0 = no lateral drag, as in Source. Non-zero quietly undoes
;                       momentum preservation on every airborne frame.
;   AirControl          1.0, was 0.45. Under the stock model AirControl WAS the air
;                       model; under the Source model it scales acceleration BEFORE
;                       the real model sees it, so anything under 1 makes the block
;                       above stop meaning what it says. Engine-owned copy.
bSourceAirAcceleration=True
AirMaxWishSpeed=160.000000
AirAcceleration=8000.000000
; MaxAirSpeed IS DELIBERATELY UNCHANGED AT 1600. Spec v5 section 1's hard cap is
; AirStrafeHardCapSpeed below; the movement component takes the tighter of the two, so
; lowering this as well would quietly make IT the operative ceiling and leave the v5
; knob doing nothing. This is the model-wide ceiling, that one is the strafe ceiling.
MaxAirSpeed=1600.000000
AirFriction=0.000000
AirControl=1.000000

; PLAYER GRAVITY - spec v9 section 8, new. Verbatim: "Increase gravity by 12%, to make
; players feel less floaty when air strafing."
;
; Expressed as UCharacterMovementComponent::GravityScale on the PAWN, not as world
; gravity: the mode-B throw derives its arc from the world value (CoreThrowGravityScale),
; and section 8 asks for the player to feel heavier, not the ball.
;
; THE KEY IS MovementGravityScale AND THAT SPELLING IS LOAD-BEARING. The movement
; component resolves it by name; it was briefly called PlayerGravityScale on both this
; page and in TraceSettings.h, which bound to nothing at all - the MOVEKNOB report said
; FALLBACK, the game ran at 1.0 gravity, and the build stayed green. Check the report,
; not this line.
;
; KNOCK-ON, stated rather than silently compensated: for the same jump impulse the apex
; drops 10.7% (1/1.12) and hang time 5.5% (1/sqrt(1.12)). Everything that measures itself
; against the jump - WallJumpVerticalMultiplier, SlideJumpZMultiplier,
; DashExitVerticalSpeedMultiplier - is a MULTIPLE of it and shrinks in proportion. What
; does NOT shrink is the arena: the cover tier is still 176uu tall, and a jump that used
; to clear a lip with room to spare now clears it with less.
;
; SPEC v12 SECTION 5 MAKES THAT MATTER MORE. It used to be cushioned by the mantle, which
; caught a player who came up short at a lip and pulled them over anyway. The mantle is
; gone, so a jump that only just clears an edge now only just clears it. If "hitting the
; top edge of an obstacle" reads badly after the removal, THIS is the first knob to look
; at - ahead of LedgeGroundGraceSeconds.
MovementGravityScale=1.120000

; AIR-STRAFE DIMINISHING RETURNS - spec v5 section 1, new. Verbatim: "The air
; strafing feels incredible, but its too powerful with how much momentum can be
; gained. I think we need a hard cap on it or an exponential scale in order to make
; it harder and harder to gain momentum past a certain point."
;
; That is praise with a ceiling on it, so what is capped is ACCUMULATION and nothing
; else: turning without losing speed is untouched, because the falloff scales the
; ADD (which is already zero for input along your direction of travel) and never the
; velocity you already have.
;
;   t     = clamp((speed - SoftCap) / (MaxAirSpeed - SoftCap), 0, 1)
;   scale = (1 - t) ^ FalloffExponent      applied to the air-accel step's add
;
; Below the soft cap the air model is bit-for-bit what it was. The measured baseline
; to beat is a continuous strafe turn reaching ~1036uu/s from 835; with a 900 soft
; cap and an exponent of 2 the gain is nearly dead well before the 1250 hard cap, so
; the ceiling is felt arriving rather than hit. Both halves are exposed so either can
; be disabled independently: bAirStrafeGainFalloff=False leaves only the hard cap,
; bAirStrafeHardCap=False leaves only the curve.
;
; ALL FOUR ARE BOUND BY NAME. UTraceCharacterMovementComponent resolves them through
; FindPropertyByName because it was written in the same pass as the settings page, so a
; spelling difference is not a build error - it is a silent fall back to the literal in
; the code. Trace.VerifyKnobs prints the verdict at startup; so does the movement
; component's own bind report.
bAirStrafeGainFalloff=True
; THESE TWO CAPS ARE BASES. Spec v9 section 8's +10% is NOT baked into them - it is
; AirStrafeAsymptoteScale below, which the movement component multiplies into both. The
; shipped caps are 950 x 1.10 = 1045 and 1250 x 1.10 = 1375. Editing these to 1045/1375
; as well ships 1149.5/1512.5, which is what this file said for part of this pass.
AirStrafeSoftCapSpeed=950.000000
AirStrafeFalloffExponent=2.000000
bAirStrafeHardCap=True
AirStrafeHardCapSpeed=1250.000000
; Spec v9 section 8, verbatim: "Move the asymptote on momentum slightly higher, to allow
; for slightly faster speeds." [ASSUMPTION] +10%, over BOTH caps at once: the soft cap is
; where the gain starts to taper and the hard cap is where it reaches zero, so scaling
; only one would change the SHAPE of the falloff instead of sliding it up. A NUDGE, not a
; removal - the ceiling the design owner asked for in Demo 5 is still here, 10% further
; out. MaxAirSpeed=1600 is deliberately NOT scaled, so the hard cap stays the tighter of
; the two and spec v5 section 1 still governs.
AirStrafeAsymptoteScale=1.100000

; LANDING - spec v3 §2.2, verbatim: "do not clamp horizontal velocity to ground max
; speed on landing. Velocity carries over from air to ground."
; There is no landing clamp to switch off in Unreal: CalcVelocity brakes hard the
; moment planar speed exceeds MaxWalkSpeed, and GroundFriction 8 x BrakingFriction 2
; plus BrakingDecelerationWalking 2600 kills 1000uu/s in ~60ms, which is
; indistinguishable from a clamp. The movement component takes over CalcVelocity for
; exactly those frames and bleeds the EXCESS at the three gentler numbers below.
;   GroundOverspeedFriction  proportional bleed. THE dial for how long carried speed
;                            lasts. At 8 (the normal ground value) you have the
;                            engine's behaviour back.
;   GroundOverspeedBraking   flat uu/s^2 with no input. A proportional bleed alone has
;                            a long tail - 2000->1000 takes as long as 1000->500 - so
;                            this is what actually lands the pawn.
;   GroundOverspeedTurnRate  how freely an overspeed pawn may steer while bleeding.
;                            Unlimited would let a landing's momentum be carried round
;                            a corner at full value, i.e. free speed.
bPreserveLandingMomentum=True
GroundOverspeedFriction=2.000000
GroundOverspeedBraking=400.000000
GroundOverspeedTurnRate=180.000000

; SLIDE: LONGER, AND IT KEEPS YOUR MOMENTUM.
; The slide entry speed is a multiple of your CURRENT speed, so momentum was always
; carried IN; what threw it away was the exit. SlideDeceleration bled 750 uu/s per
; second, which met SlideExitSpeedFraction and ended the slide early, so the slide
; read as a brake. Now:
;   Duration      1.0  -> 1.8   (the "longer" dial - with a gentle decay this is
;                                what actually ends a slide)
;   Deceleration  750  -> 260   (the momentum dial - a 1.8s slide now sheds only
;                                ~470 uu/s in total, so it exits above walking pace)
;   MaxSpeed      1500 -> 1900  (the entry clamp; at 1500 a slide out of a dash was
;                                a speed LOSS, which is the opposite of preserving
;                                momentum)
;   ExitFraction  0.60 -> 0.50  (lets the slide run to its duration)
;
; SPEC v4 §1 CLOSED THE CONFLICT SPEC v3 LEFT OPEN. Verbatim: "The flat momentum
; boost should be ruled out, going with the source-style movement system instead."
;   SlideImpulse                 DELETED (the property is gone, not zeroed). It was
;     the flat additive on slide entry - worth the same whether you entered at a walk
;     or out of a dash, which is precisely what "no flat momentum boost" rules out.
;   SlideExitMinSpeedFraction    DELETED (see the exit block below).
;   SlideEntrySpeedMultiplier    stays at 1.00. Entry speed IS slide speed. You keep
;     what you brought in, SlideDeceleration bleeds it, nothing tops it up.
;   The payoff for sliding is now the SLIDE-JUMP block further down, which preserves
;   momentum through the jump rather than manufacturing any.
;   SlideCooldownSeconds       2.40 -> 0.80  (".8second buffer between slides")
;     MEASURED FROM THE SLIDE'S END, which is new. The old SlideCooldown was measured
;     from the slide's START, so the buffer between slides was a number you had to
;     compute, and any value below SlideDuration meant no cooldown at all. RENAMED
;     with the semantic change on purpose: a stale ini carrying the old 2.40 must not
;     land on the new knob and silently produce a four-second gap.
; SLIDE IS A ONE-SHOT ABILITY AS OF SPEC v5 SECTION 3. Verbatim: "Rather than making
; it a slide you can hold down, have it trigger once, like an ability, with a hidden
; cooldown to prevent spamming it."
; There is no key for it because there is no switch: the movement component implements
; the ability model unconditionally, so a toggle here would be a slider that moves
; nothing. One press buys exactly SlideDuration seconds; holding does nothing extra and
; releasing cancels nothing. SlideCooldownSeconds (0.8, unchanged, charged from the
; slide's END) IS the hidden cooldown - enforced, and deliberately NOT drawn on the
; HUD, so do not add a UI for it.
; SlideMinCommitSeconds WAS HERE AND IS DELETED WITH ITS PROPERTY: it described the
; window in which releasing crouch could not cancel a slide, and a one-shot ability has
; no partial commit. Nothing reads it any more.
SlideEntrySpeedFraction=0.550000
SlideEntrySpeedMultiplier=1.000000
SlideMaxSpeed=1900.000000
; SlideDuration IS THE BASE. Spec v9 section 6's -30% is SlideMaxLengthScale below, which
; the movement component multiplies in: the shipped slide is 1.8 x 0.7 = 1.26s. Cutting
; this to 1.26 as well ships 0.88s, a 51% cut.
SlideDuration=1.800000
; Spec v9 section 6, verbatim: "Reduce max slide length by 30%." x0.7 on the DURATION, not
; on the deceleration: with SlideDeceleration at 260 a slide barely decays inside its
; window (a 1100uu/s slide loses ~13% over 1.8s), so distance is very nearly proportional
; to time - ~1815uu over 1.8s becomes ~1300uu over 1.26s, a 28.4% cut in distance.
; Shortening it by bleeding speed faster, or by capping SlideMaxSpeed, would have
; CONFISCATED momentum the player brought in - the one thing this movement kit refuses to
; do (spec v4 section 1). Bound BY NAME as SlideMaxLengthScale.
SlideMaxLengthScale=0.700000
SlideDeceleration=260.000000
SlideExitSpeedFraction=0.500000
SlideTurnRateDegrees=130.000000
SlideCooldownSeconds=0.800000
SlideInputBufferSeconds=0.250000

; SLIDE EXIT / COMMIT. These are what make the slide PRESERVE momentum - the
; duration and deceleration above only make it longer.
;   MinCommit          the first 0.55s of a slide ignore a released crouch key, so
;                      a tap gets the whole slide and SlideDuration means something
;   ExitRetention 1.0  hand back ALL of the slide's live speed (the old exit only
;                      ever clamped DOWN, which is where the momentum was going)
;   ExitMaxMultiplier 1.0  the ceiling. EndSlide() takes max(this x max speed, the
;                      slide's own speed), so it can never brake a fast slide; it
;                      only decides how much overspeed a SLOW exit may keep.
;
; SlideExitMinSpeedFraction IS DELETED (spec v4 §1, verbatim: "you can remove the
; slideexitminspeedfraction value"). At 1.0 it handed EVERY slide back at exactly
; WalkSpeed however slowly it was actually going - measured as a 73% speed GAIN on a
; slide that had decayed. That is the flat momentum boost, wearing an exit-side hat.
; A slide now ends at whatever friction left it with. If a stale saved config still
; carries the key it is simply ignored: the property no longer exists.
;
; SlideMinCommitSeconds IS DELETED THE SAME WAY (spec v5 §3). It was the window in
; which releasing crouch could not cancel a slide; the slide is a one-shot ability now
; and the whole of it is committed the moment it starts, so the number had nothing left
; to mean. The movement component deleted its accessor in the same pass.
SlideExitSpeedRetention=1.000000
SlideExitMaxSpeedMultiplier=1.000000

; SLIDE-JUMP (spec v4 §1). "is it possible to add a slide-jump mechanic, also
; attempting to feel like apex legends."
;
; This is the payoff move, and with the flat boost gone it is the entire reason to
; slide: the slide holds a fast vector low to the ground while friction bleeds it
; slowly, and the slide-jump is how you cash that vector in before the bleed finishes.
;   HorizontalRetention 1.00  keep ALL of the slide's live planar speed through the
;                             jump. This is pure preservation, not a boost - what it
;                             replaces is the ground friction that would have eaten
;                             the carry, which is already a large buff.
;   ZMultiplier         1.00  an ordinary jump height. Apex's slide-hop buys DISTANCE,
;                             not height; drop this toward 0.85 for a flatter launch.
;   WindowSeconds       0.20  the last 0.20s of the slide (and the 0.20s of coyote
;                             time immediately after it ends) count as WELL TIMED.
;   WindowSpeedBonus    1.10  what a well-timed hop is worth. The one intentionally
;                             gain-shaped number in the slide path, and it is gated
;                             behind execution rather than handed out for pressing
;                             crouch - which is the distinction spec v4 §1 draws.
;                             Set to 1.00 to make the window a no-op.
; The 0.8s SlideCooldownSeconds is unchanged and still charged from the slide's END,
; so a slide-jump cannot be chained into a hopping loop.
bSlideJumpEnabled=True
SlideJumpHorizontalRetention=1.000000
SlideJumpZMultiplier=1.000000
SlideJumpWindowSeconds=0.200000
; 1.100000 -> 1.250000 THIS PASS. Spec v5 section 3, verbatim: "Increase the
; multiplier gained by perfectly timing a jump at the end of a slide." Now that the
; slide is a fixed-length ability on a cooldown, the timed exit is the only skill
; expression sliding has left, so it has to be worth reaching for: 1.3125 on a ~1100uu/s
; slide is ~344uu/s, a third of a walk speed. The air-strafe falloff above is what
; stops it compounding into free arena-crossing speed.
;
; 1.25 -> 1.3125 in spec v8 section 8, verbatim "Increase momentum from slide jump by 5%".
; [ASSUMPTION] read as 1.25 x 1.05. THE ALTERNATIVE READING IS 1.25 + 0.05 = 1.30, five
; percentage points rather than five percent. They differ by ~14uu/s on a 1100uu/s slide,
; below what a player can feel - so if 1.30 was meant, change THIS LINE and nothing else.
;
; THIS LINE IS THE BASE. Spec v9 section 7's +30% is SlideJumpBonusScale below; the
; shipped multiplier is 1 + (1.3125 - 1) x 1.30 = 1.40625.
SlideJumpWindowSpeedBonus=1.312500
; Spec v9 section 7, verbatim: "Increase the bonus of timing a slide jump right by 30%."
; THE READING IS THE BOOL, NOT THE NUMBER, and both are implemented as the spec asks:
;   bSlideJumpBonusScalesGainOnly=True   "the bonus" is the part above 1.0, which is what
;                                        the timing actually buys: 1 + 0.3125 x 1.30 =
;                                        1.40625. SHIPPED, and the spec's [ASSUMPTION].
;   bSlideJumpBonusScalesGainOnly=False  "the bonus" is the whole multiplier: 1.3125 x
;                                        1.30 = 1.70625. A ~1100uu/s slide would launch at
;                                        ~1877uu/s, and a 1900uu/s one at 3242uu/s - past
;                                        DashSpeed's own 3000. A slide-hop faster than a
;                                        dash inverts the game's counterplay, so it is not
;                                        the default.
SlideJumpBonusScale=1.300000
bSlideJumpBonusScalesGainOnly=True
; New in spec v5 section 3, and the other half of "increase the multiplier": height is
; the channel a player can SEE. 25% more planar speed is deniable; clearing a box you
; could not clear a second ago is not. Bound BY NAME as SlideJumpWindowZBonus.
SlideJumpWindowZBonus=1.120000

; --- Ledges (spec v12 section 5. WAS "Mantle", spec v5 section 7 - THE MANTLE IS GONE) ---
; v12 verbatim: "Remove mantling from the game, keep wall jumping. Make sure there's no
; bug when a player hits the top edge of an obstacle."
;
; EIGHT KEYS WERE DELETED FROM THIS BLOCK, NOT COMMENTED OUT AS OVERRIDES:
;   bMantleEnabled  MantleReachUU  MantleMinHeightUU  MantleMaxHeightUU
;   MantleDurationSeconds  MantleUpPhaseFraction  MantleCooldownSeconds
;   MantleMinForwardSpeed
; plus WallJumpMantleLockoutSeconds from the wall-jump block below. The properties are
; gone from UTraceSettings and nothing reads them. LEAVING THEM HERE WOULD BE WORSE THAN
; A TYPO: an ini key with no property behind it is silently ignored, so the file would
; document a feature the build does not have and a designer would tune numbers that
; reach nothing. Do not re-add them "just in case" - Trace.VerifyKnobs no longer lists
; them either, and the two files are meant to agree.
;
; DELETING THE MANTLE RISKS HANDING BACK THE BUG IT WAS ADDED FOR. Demo 5 asked for the
; mantle as the fix for "when jumping on the edge of a raised section, it's glitchy and
; feels like rubber banding" - and a mantle never fixed that, it HID it. The
; disagreement between client and server about a ledge collision was still there on
; every ledge the mantle did not trigger on. v12 asks for the underlying bug outright,
; which is why the key below survives the removal and is now the whole section.
;
; THE OTHER HALF OF THE LEDGE BUG, AND SINCE v12 THE ONLY HALF THAT SHIPS. "Rubber
; banding" at a lip is a one- or two-frame contact blip where the client and server
; disagree about walking vs falling; 0.08s is about five frames at 60Hz, long enough to
; swallow it and far too short to let a pawn run off a roof and keep its footing. 0
; restores the exact Demo 5 behaviour the desync was measured against - keep it as the
; A/B arm. Bound BY NAME as LedgeGroundGraceSeconds by the movement component.
LedgeGroundGraceSeconds=0.080000

; --- Wall jump (spec v8 section 7, new) ---
; "Press jump right as they hit a wall to carry momentum in a new direction."
;
; CARRY, NOT RESET: the launch REFLECTS the incoming planar velocity about the wall
; normal, so a player arriving at 1400uu/s leaves at 1400 x WallJumpSpeedRetention in a
; new direction rather than at walking pace with a fresh jump arc. WallJumpOutwardImpulse
; is the floor that makes a GLANCING wall jump still do something - a player sliding
; along a face has almost nothing to reflect.
;
; ALL SEVEN ARE BOUND BY NAME by the movement component (TraceMoveKnob). The MOVEKNOB
; report at BeginPlay prints BOUND or FALLBACK for every one, every run - if a rename
; ever breaks one of these it says so out loud rather than silently playing the default.
;
; WallJumpMaxConsecutive IS THE ANTI-LADDER CAP the spec asks for by name: without it two
; close walls are an infinite staircase. 2 buys wall-then-wall-then-somewhere-new and
; refuses the third. Raising it is the most likely way to break the arena's sightlines.
;
; WallJumpMaxNormalZ separates "wall" from "ramp you could have walked up" - the walkable
; floor Z is 0.71 at the 45-degree slope limit, so 0.4 leaves a clear band and stops a
; shallow approach ramp from becoming a trampoline.
;
; It cannot beat the air-strafe cap: the launch's planar speed is clamped to
; max(entry speed, AirStrafeHardCapSpeed), the same rule the air strafe uses, so a wall
; jump can CARRY speed that was already over the cap but can never ADD past it.
bWallJumpEnabled=True
; BOTH OF THE NEXT TWO ARE BASES. Spec v9 section 5 is applied by the two scale keys
; further down, so the shipped numbers are 0.25 x 0.6 = 0.15s and 0.95 x 0.9 = 0.855.
; Cutting the bases as well ships 0.09s and 0.7695 - a window shorter than a 40ms client's
; own latency, and a retention below the ~0.8 floor at which the move stops reading as
; carrying momentum. This file said exactly that for part of this pass.
WallJumpWindowSeconds=0.250000
WallJumpSpeedRetention=0.950000
WallJumpOutwardImpulse=420.000000
WallJumpVerticalMultiplier=1.050000
WallJumpMaxConsecutive=2
WallJumpMaxNormalZ=0.400000
; --- Spec v9 section 5, the three new wall-jump scalars ---
; Verbatim: "Reduce momentum gained from wall jumping by 10%", "Right now it feels like
; the player is sticking to the wall for a second: Make the window of time for performing
; a wall jump shorter and make the action happen faster", "If a player inputs a wall jump,
; that overrides a mantle".
;
; WallJumpWindowScale     x0.6 on the contact window: 0.25s -> 0.15s. The stickiness a
;                         player feels IS that window. [ASSUMPTION] a 40% cut - still
;                         wider than a 40ms client's own latency, so the move stays
;                         performable online; do not take the product below ~0.10s.
;                         (It USED to also shorten how long an auto-mantle stood aside for
;                         a live wall jump. Spec v12 section 5 removed the mantle, so this
;                         key now does exactly one thing.)
; WallJumpMomentumScale   x0.9 on the retention, which is the spec's own [ASSUMPTION].
;                         Measured end-to-end retention was ~104.6-105.4% - a net GAIN,
;                         because the outward impulse and the vertical add on top - and
;                         this lands it near ~95%. TO SWITCH READINGS: set this to 1.0 and
;                         cut WallJumpOutwardImpulse instead, the only other launch term.
; SPEC v12 SECTION 5 DELETED WallJumpMantleLockoutSeconds (v9's "a wall jump overrides a
; mantle"). Its only job was to stop the mantle vacuuming a player back onto the lip they
; had just launched off. With the mantle removed there is nothing to hold off, so the key
; and its property are both gone rather than left sitting at 0.
; WHAT TO CHECK BECAUSE OF IT: the wall jump used to WIN a priority fight against the
; mantle. That fight no longer exists, and a trigger that only ever ran as the winner of
; it must still fire on its own. "Keep wall jumping" is half of the v12 section 5 request.
WallJumpWindowScale=0.600000
WallJumpMomentumScale=0.900000

; --- SPEC v10 SECTION 5 - WALL JUMPING, THE THIRD TIME ------------------------------
; Verbatim: "Wall jumping still feels like the player is sticking to the wall for a
; moment too long. Reduce the momentum boost from wall jumping by 10%".
;
; v9 already cut the input window 0.25 -> 0.15 and stopped the mantle stealing the
; input, and it STILL feels sticky, so v10 stops shaving the same number and adds the
; two knobs that address the cause instead.
;
; WallJumpControlLockoutSeconds  THE CAUSE. A wall jump is performed while HOLDING the
;                         key toward the wall - that is how you got there. The launch
;                         reflects the velocity outward correctly and then the next move
;                         tick adds the still-held toward-the-wall input straight back as
;                         acceleration, dragging the pawn into the face it just left. The
;                         pawn really is leaving; for the first fraction of a second it is
;                         leaving by a few uu. This suppresses the toward-the-wall
;                         component for 0.20s. 0 = the v9 behaviour, i.e. the RED arm.
; WallJumpInputBufferSeconds  the other half. v9's shorter contact window also made a
;                         press that landed a frame or two EARLY simply vanish - press
;                         jump, nothing happens, still on the wall. 0.12s remembers the
;                         press and spends it on the first frame contact is legal. Kept
;                         SHORTER than the contact window so a buffered press cannot
;                         outlive the contact it was meant for. 0 disables buffering.
; WallJumpMomentumScaleV10  the requested further -10%, as its OWN scalar over v9's, the
;                         same rule v9 set for itself. Shipped retention is therefore
;                         0.95 x 0.90 x 0.90 = 0.7695. That is under the ~0.8 floor the v9
;                         note calls the point where the move stops reading as carrying
;                         momentum - v10 asked for the cut anyway and it ships, but THIS
;                         is the knob to raise if a playtest says a wall jump now stops
;                         you dead. Do not "fix" it by editing the other two.
;
; All three bind BY NAME through TraceMoveKnob; Trace.VerifyKnobs proves it and
; MOVECFG-V10 prints the values in force. Trace.V10LegacyWallJump 1 is the before arm.
WallJumpControlLockoutSeconds=0.200000
WallJumpInputBufferSeconds=0.120000
WallJumpMomentumScaleV10=0.900000

; --- SPEC v12 SECTION 3 - THE KNIFE'S MOVEMENT KIT (was v10 section 1) ---------------
; v12 verbatim: "Reduce max speed with the knife from the previous 30% increase to 22%
; and adjust momentum accordingly."
; v10 verbatim, which this walks back: "Players should move 30% faster with a knife, as
; well as have a higher momentum ceiling."
;
; *** PARITY WITH THE CARRIER IS RESTORED - SPEC v13 §3, "update carrier speed to match
; *** the new knife speed". CarrierSpeedMultiplier (up in the Movement|Walk block) was
; *** left at 1.30 by v12 and flagged there; the user has now called it and it reads
; *** 1.220000, so both are 800 x 1.22 = 976 uu/s again. IF THE KNIFE IS RETUNED AGAIN,
; *** MOVE THE CARRIER WITH IT or the same break comes back - Trace.DumpSettings prints
; *** the pair and says MATCHED or BROKEN so it cannot go unnoticed for another pass.
;
; "ADJUST MOMENTUM ACCORDINGLY" SCALES THE BONUS, NOT THE MULTIPLIER. The bonus is the
; part above 1, so soft = 1 + 0.25 x (22/30) = 1.183333 and hard = 1 + 0.35 x (22/30) =
; 1.256667. Scaling the multipliers themselves (1.25 x 22/30 = 0.917) would put the knife
; BELOW the gun's own air caps and turn the mobility kit into a penalty. Shipped ceilings
; with a knife out: soft 1045 x 1.183333 = ~1237 uu/s (was ~1306), hard 1375 x 1.256667 =
; ~1728 uu/s (was ~1856). The soft < hard ordering survives because both bonuses are
; scaled by the same factor.
;
; ONLY THE MOVEMENT NUMBERS ARE HERE. Damage, back-stab angle, swing cooldown, swap
; time and reach are the WEAPON and live in [/Script/Trace.TraceMeleeSettings] at the
; bottom of this file. These three multiply WalkSpeed / AirStrafeSoftCapSpeed /
; AirStrafeHardCapSpeed, which are on this page, and are read by the movement component
; through the same TraceMoveKnob path as every other movement scalar.
;
; The two air multipliers are DIFFERENT NUMBERS on purpose: raising both by the same
; factor moves the ceiling without widening the band a skilled air-strafer plays in.
; The pair raises it AND opens it. NEVER set the hard multiplier below the soft one -
; each is clamped independently and nothing cross-checks them, so that would put the
; hard cap under the soft cap and cut gain off before the falloff began, making the
; knife SLOWER in the air than the gun.
;
; THESE THREE KEYS WIN OVER THE HEADER. UTraceSettings carries the same values; if they
; ever disagree, this file is what the game plays at. Verify from a running game with
; Trace.VerifyKnobs, never by reading TraceSettings.h.
KnifeMoveSpeedMultiplier=1.220000
KnifeAirStrafeSoftCapMultiplier=1.183333
KnifeAirStrafeHardCapMultiplier=1.256667

; SLIDE POSE. PROCEDURAL - THERE IS NO STOCK MANNEQUIN SLIDE ANIMATION. The notes ask
; for "unreal's default slide animation for the mannequins"; it does not exist. The
; imported set is Death, Jump, Pistol, Rifle and Unarmed locomotion, with no slide and
; no crouch anywhere in Templates/TemplateResources or Engine/Content. These knobs
; drive an approximation built from the skeleton we already have: recline the whole
; mesh over its feet, drop it toward the deck, and slow the locomotion blend space
; almost to a stop so the legs stop sprinting mid-slide. Visual only - the capsule
; never resizes, so hit zones, lag compensation and the trail trip test are untouched.
SlidePoseLeanDegrees=30.000000
SlidePoseDropUU=20.000000
SlidePoseRollDegrees=9.000000
SlidePoseAnimRateScale=0.120000
SlidePoseBlendSpeed=9.000000

; BOOST IS GONE (spec v3 §1: "remove boost from the game entirely").
; BoostZVelocity and BoostCooldown were here. Deleted with the feature, along with
; BotBoostCooldownSeconds above - the whole point of removing an ability is that
; nobody is left tuning it.

; --- Core: the hover pass ---
; FIVE DEAD KEYS DELETED HERE, with their properties: PassSpeed, PassUpwardBias,
; PickupRadius, PickupLockoutAfterThrow and CoreResetTime. The Core stopped being a
; thrown, catchable object - it is a STATUS that transfers by holding the crosshair
; on a teammate - so those described a projectile and a pickup that do not exist.
; ATraceCore::Throw ignores its speed argument and IsPickupLockedOutFor() returns
; false unconditionally; nothing read any of the five.
;
; What replaces them is the set of numbers the hover pass actually runs on. They were
; compile-time constants in TraceCoreTuning (Gameplay/TraceCore.cpp), whose own
; comment asked for exactly this promotion.
PassHoldSeconds=0.500000
PassMaxRange=8000.000000
PassTargetChestOffsetZ=20.000000

; THE PASS-INCONSISTENCY FIX (spec v3 §4.1: "sometimes the pass option doesn't show
; up"). A pass was measured dying 24ms short because the receiver crossed behind a
; lane rail, and every cancellation used to cost the full 2s cooldown - which from
; the inside reads as the mechanic not being there. Five values move:
;   PassCancelCooldownSeconds  2.00 -> 0.25. A pass the player never chose to abandon
;                              must not lock them out. Cannot be 0: the cancel path
;                              flips the shield and forces a net update, so a
;                              permanently-illegal target would churn that per frame.
;   PassValidationGrace  0.15  an in-flight pass survives a receiver who is
;                              momentarily out of LOS / off the crosshair / out of
;                              range. Covers ONLY those transient geometric tests - a
;                              receiver who dies or changes team cancels instantly.
;   PassAcquireSticky    0.20  acquisition keeps returning the last receiver this
;                              long. This is the DISPLAY half of the report: the HUD
;                              polls ~20Hz, so a target flickering in and out of
;                              legality makes the pass OPTION flicker.
;   PassAimConeDegrees   6 -> 9   at 6 deg a teammate 4000uu away had to be held
;                              inside a circle ~420uu across while both of you ran.
;   PassAimSlack        40 -> 70  close-range test; a near receiver is now acquirable
;                              well off their silhouette.
; bPassMultiPointLos probes chest/head/knees and accepts any clear one. A single
; chest ray against the new 176/352/616uu cover boxes is close to a coin flip.
PassCooldownSeconds=2.000000
PassCancelCooldownSeconds=0.250000
PassAimConeDegrees=9.000000
PassAimSlack=70.000000
PassValidationGraceSeconds=0.150000
PassAcquireStickySeconds=0.200000
bPassMultiPointLos=True

; TURNOVER GRACE: 1.0 -> 0.4 (spec v3 §1) -> 0.5 (spec v4 §5, which asks for exactly
; 0.4 x 1.25) -> 0.750000 (spec v10 §3). Seconds after the Core changes TEAM before
; the new carrier's trace starts forming. It exists so a turnover does not instantly
; wrap the new carrier in lethal trace laid on top of the scrum they won it in; at a
; full second the counter-attack also got a free run with no trace behind it. 0.75s is
; ~645uu at carrier speed. A pass between teammates gets no grace, by design - and in
; mode B a teammate recovering a thrown Core gets none either, while an enemy
; intercepting it gets this (spec v4 §7).
;
; SPEC v10 §3 IS A CONDITIONAL AND THIS IS WHICH BRANCH IT TOOK. Verbatim: "The grace
; period on turnovers doesn't seem to be working. Test it on both modes, fix it if
; needed. If it IS working, increase to .75seconds". IT IS WORKING. Measured with
; Trace.Trail.GraceTest, which drives a real turnover through ATraceCore::GrantTo and
; times the new holder's FIRST laid point against the shared clock:
;
;   mode A (EndzoneStatusCore)  team change 0.506s vs 0.500 configured   PASS
;                              same-team pass 0.009s vs 0.000 expected   PASS
;   mode B (ThrownCoreAndGoals) team change 0.512s vs 0.500 configured   PASS
;                              same-team pass 0.012s vs 0.000 expected   PASS
;
; 2 of 2 cases in each mode, and the v9 §3 instant clear composed with it both times
; (the old carrier dropped 19 points to 0 on the very next frame). So nothing was
; broken and this is the "increase" branch, not the "fix it" branch. If a playtest
; still says it does not work, the thing to doubt is what a player is EXPECTING the
; grace to do: it delays FORMATION and never lethality, so trace already on the
; ground kills throughout the window and always has.
CoreTurnoverGraceSeconds=0.750000

; --- Core: MODE B ONLY (the thrown, interceptable Core; spec v4 §7) ---
; INERT unless ScoringMode=ThrownCoreAndGoals. In mode A the Core is a status and
; cannot be thrown, dropped or stood on, so none of these eight are read.
;
; EVERY KEY NAME HERE IS LOAD-BEARING. ATraceCore resolves each one by REFLECTION on
; UTraceSettings (TraceModeBTuning::Resolve) and falls back to a Trace.ModeB.* console
; variable when the lookup misses. A misspelled property name therefore does not fail
; the build and does not warn - it silently plays the CVar default while the settings
; panel shows a slider that moves nothing. That is exactly what happened to
; CoreThrowUpBias, which shipped for a while as "CoreThrowUpwardBias".
;
;   ThrowSpeed        deliberately not instant. A Core that crosses the field in half
;                     a second cannot be intercepted by anyone, and "the first player
;                     to contact the core should pick it up" is the whole of mode B.
;   ThrowUpBias       fraction of the throw speed added as lift, so a throw arcs
;                     instead of catching on the first piece of cover. Load-bearing
;                     since spec v6 §4.3 raised the hoop off the floor: a perfectly
;                     flat throw cannot reach the goal at all.
;   GravityScale      world gravity multiplier on a Core in flight. Below 1 because the
;                     field is 33600uu long: at full gravity an aimable throw ploughs
;                     into the floor within a couple of thousand uu.
;   PickupRadius      contact test radius. Well above the 34uu capsule ON PURPOSE: at
;                     3000uu/s the Core moves 50uu per 60Hz frame, so a tight radius
;                     lets it tunnel through the player standing in its path - which
;                     reads as "interception is broken", not as "I was too slow".
;   ThrowerLockout    seconds the THROWER alone cannot re-take their own throw. Without
;                     it a throw is a no-op - the Core leaves from inside the thrower's
;                     own pickup radius and is re-taken on the next tick.
;   ThrowCooldown     seconds after TAKING the Core before it can be thrown again, so a
;                     pickup and a throw cannot land on the same frame.
;   Bounce            restitution against geometry. 0 = dead stop, 1 = perfect bounce.
;                     Low so a missed throw settles somewhere contestable.
;   LooseReset        seconds a Core may lie untouched before it returns to play.
;                     0 = never - and 0 now genuinely means never. It used to be
;                     clamped up to a 1 second floor, so "disable the reset" produced
;                     the FASTEST reset available. The out-of-world rescue still runs
;                     either way, so the Core can never be lost permanently.
; "INCREASE THE WEIGHT OF THE CORE" (spec v5 section 4) IS CoreMassScale BELOW, AND THE
; FOUR BASE KEYS HERE DELIBERATELY DID NOT MOVE. The Core has no rigid body, so there is
; no mass field for a kg value to feed; ATraceCore derives the whole weight model from
; one multiplier M applied at the point of use - gravity x M, throw speed / sqrt(M), up
; bias x M^1.5, bounce / M, rest speed x M. Lowering the base speed or raising the base
; gravity here as well would apply the weight TWICE and this panel would stop describing
; the throw anybody is playing.
CoreThrowSpeed=3000.000000
CoreThrowUpBias=0.120000

; --- Throw velocity inheritance (spec v8 section 4, new) ---
; "When jumping and throwing the core, the core doesn't seem to keep momentum. Make sure
; that the core has the momentum from the throw and also carries momentum from the
; player." Before v8 the launch was the impulse and NOTHING ELSE, so a throw at a dead
; sprint and a throw standing still left at exactly the same speed, and a throw at the
; top of a jump threw the jump away - which is the case the note names.
;
; Launch = impulse + thrower velocity x this. VERTICAL INCLUDED: that is the jumping
; throw. Measured on a joining client at 40ms PktLag, jumping: 2328 -> 3357uu/s and the
; launch Z 648 -> 1288.
;
; NOT scaled by CoreMassScale, unlike the four base keys above. Mass says how hard the
; Core is to THROW and already divides the impulse; momentum is transferred by CARRYING
; it, so a heavier Core leaves the same jump with the same velocity. Weighting both would
; apply the weight twice.
;
; 0 replays the pre-v8 throw exactly - that is the A/B if this proves too strong.
; 0.6 is the middle setting: keeps the jumping throw (launch Z 648 -> 1032) while cutting
; the dash-throw tail case by 40%.
CoreThrowVelocityInheritance=1.000000

; --- THE CHARGE-UP THROW (spec v13 §6, new) -----------------------------------------
; Verbatim, in order:
;   "When a player RELEASES the throw button, the core should instantly be released."
;   "The longer the player holds down, the more momentum the core has."
;   "Start by making a one second charge up time to reach the current core throw momentum"
;   "Charge time to throw momentum should be a linear correlation"
;   "So if the player just clicks the throw button it will throw with very low momentum"
;
; *** THE ARITHMETIC, ONCE, BECAUSE FOUR NEW KEYS AND TWO OLD ONES MEET IN ONE EXPRESSION
; *** AND EVERY MISREADING OF IT IS A PLAUSIBLE-LOOKING WRONG THROW:
; ***
; ***   t      = HeldSeconds / CoreThrowChargeSeconds
; ***   tCap   = ClampsAtFull ? min(t, 1) : min(t, CoreThrowChargeMaxFraction)
; ***   Power  = Floor + (1 - Floor) * tCap
; ***   Launch = Dir * CoreThrowSpeed * Power / sqrt(CoreMassScale)
; ***            + ThrowerVelocity * CoreThrowVelocityInheritance
; ***
; *** CHARGE SCALES THE IMPULSE ONLY. The inherited velocity (v8 §4, the key just above)
; *** is added ON TOP and is NOT scaled by charge - a tap-throw from a sprint still
; *** carries the sprint, which is right: the player's own momentum is not something they
; *** charge up. Weight still divides the impulse afterwards, unchanged.
;
; RELEASE IS INSTANT and that is a code rule, not a key: the throw leaves on the release
; frame with whatever power has accumulated. There is deliberately no minimum-hold key,
; because one would contradict the user's first sentence while looking like tuning.
;
; ChargeSeconds  1.0 is the user's number and the anchor: at exactly this hold Power = 1
;                and the Core leaves at the throw the game has today, so nothing changes
;                for a player who holds a second. Never 0 - the clamp starts at 0.05, and
;                "turn charging off" is Floor=1.0, which says what it means.
; Floor          [ASSUMPTION] 0.15. "Very low" for a click: 3000 x 0.15 = 450uu/s, a lob
;                of a few metres. NOT ZERO - a zero-momentum throw drops the Core at the
;                thrower's feet inside their own pickup radius and reads as a broken
;                button, and it would strand the Core there for
;                CoreThrowerPickupLockoutSeconds on top.
; ClampsAtFull   [ASSUMPTION] True. The user said a second reaches the current momentum
;                and said nothing about beyond, so a second is the maximum and today's
;                throw is still the strongest in the game. It also keeps the charge bar
;                honest - a bar that fills and then keeps mattering is a bar that lies.
; MaxFraction    the ceiling when ClampsAtFull is False. 1.0 so unticking the box changes
;                nothing by itself; an overcharge that appears the moment somebody flips a
;                switch is an overcharge nobody chose. Raising it re-tunes mode B as a
;                whole - gravity, goal distance and the 450uu catch radius were all tuned
;                against a 3000uu/s ceiling.
;
; The charge INDICATOR is local and instant (client's own held-time, no replication); the
; THROW stays server-authoritative and recomputes Power from the server's held-time, so a
; client cannot claim more power than they held for. Bots must charge for distance using
; the same expression - a bot that always taps throws at 15% and mode B looks broken.
CoreThrowChargeSeconds=1.000000
CoreThrowChargeFloorFraction=0.150000
bCoreThrowChargeClampsAtFull=True
CoreThrowChargeMaxFraction=1.000000
CoreThrowGravityScale=0.550000
; M. 1.0 is exactly the pre-v5 flight, which is the A/B needed to judge the feel. At 1.8
; a flat throw measures: launch 3000 -> 2236uu/s, gravity 539 -> 970uu/s^2, flat range
; ~5000 -> ~3400uu, apex ~120 -> ~215uu. Mode B only - mode A's Core never moves under
; its own power, so there is nothing for a weight to apply to. Bound BY NAME.
CoreMassScale=1.800000
CorePickupRadius=120.000000
CoreThrowerPickupLockoutSeconds=0.350000
CoreThrowCooldownSeconds=0.350000
CoreThrowBounce=0.350000
CoreLooseResetSeconds=12.000000

; --- Catch zone (spec v6 §4.1, mode B only) ---
; "create a small invisible radius around players that acts as a 'catch zone,' so that
; when the core enters that area, it curves towards the player like a magnet."
; Applies to EVERY player, friend or enemy - interception is a feature. Steers
; DIRECTION ONLY, so the Core never gets faster or slower than the throw that made it,
; and the pull falls off to zero at the edge of the zone so there is no discontinuity
; when a Core clips the boundary. A target BEHIND the Core is refused, so it cannot
; reverse into somebody it already passed.
;   CatchRadius       the funnel. Deliberately far wider than CorePickupRadius (120):
;                     the pickup radius is where possession changes hands, this is what
;                     feeds it. Past ~1000 the Core visibly homes and an interception
;                     stops feeling earned. 0 disables the magnet.
;   CatchCurve        exponential approach rate, frame-rate independent. Scales the
;                     bend at point-blank, not at the boundary.
;   ThrowerLockout    the thrower alone is excluded this long, or a throw curves
;                     straight back into the hands it left. Same failure
;                     CoreThrowerPickupLockoutSeconds prevents, one step earlier.
; All three are bound BY NAME by ATraceCore (TraceModeBTuning::Resolve), so a typo here
; is a slider that moves nothing rather than a build error. Trace.VerifyKnobs checks it.
;
; SPEC v12 §4: CoreCatchRadius 500 -> 450. Verbatim: "Reduce the 'magnet' radius for
; catching in game mode b by 10%". Mode B only - ServerApplyCatchZone is reached only
; from the mode-B loose-Core tick, so mode A cannot observe this line at all.
; THIS KEY WINS OVER THE HEADER. UTraceSettings::CoreCatchRadius also reads 450; if the
; two ever disagree, this file is the one the game plays at. Verify from a running game
; with Trace.VerifyKnobs, never by reading the header.
; The cut bites hardest on a FAST Core: the pull falls off to zero at the boundary, so a
; smaller radius steers less at every distance, and a throw inheriting a jumping
; thrower's velocity (up to ~3357 uu/s) crosses the zone in fewer frames to be steered
; in. If that case needs help back, raise CoreCatchCurveStrength - not this.
CoreCatchRadius=450.000000
CoreCatchCurveStrength=6.000000
CoreCatchThrowerLockoutSeconds=0.500000

; --- CONTESTED MAGNET: NEAREST PLAYER WINS (spec v13 §5, new) -----------------------
; Verbatim: "If the core is within the 'magnet' zone of two or more players from opposite
; teams, it should go to the player closest to the core."
;
; THE RULE NEEDS NO KEY - nearest wins, and it is applied to ANY contested set rather
; than only to opposing teams ([ASSUMPTION]: the quote names the interesting case, not a
; restriction; two teammates contesting deserve the same determinism). What needs a key
; is the TIE. "Nearest" is a float comparison made every server tick on two moving
; players: two chasers a few uu apart swap the lead several times a second, the curve
; target follows them, and the Core visibly wobbles between two people. That is the
; oscillation §5 asks to avoid.
;
; WHAT THIS NUMBER MEANS: the CURRENT target keeps the Core until a rival is closer by
; MORE than this many uu. The margin is on the challenger, not on the holder, so it is
; stable without being sticky - a genuine overtake of half a metre still switches at once.
; 50uu against the 450uu radius is ~11% of the zone and about 1.5 capsule radii (34uu):
; too small to win a contest you are visibly losing, big enough to swallow the frame-to-
; frame jitter of two sprinting capsules.
;
; 0 DISABLES IT and gives raw nearest-wins - the arm that reproduces the flicker, which
; is the only way to tell "fixed" from "hidden". Server-authoritative, like the catch
; zone itself: a client running this on its own smoothed pawn copies would disagree at
; the boundary and draw the Core curving to the wrong player.
CoreCatchContestHysteresisUU=50.000000
; SPEC v7 §4 - "sometimes the core gets stuck up top of an object in gamemode b. This
; should also count as a turnover. Walls should not, the core should bounce off those."
; Degrees from straight up. The arena is generic static meshes, so the wall/floor
; question is answered by the HIT NORMAL, never by actor type: a Core at rest is probed
; downward and whatever holds it up is classified here. Within 45 deg of up = floor or
; the top of any structure -> turnover to the nearest enemy. Steeper = a wall -> the
; Core keeps its downward component, stays live, and turns over wherever it lands.
; Bound BY NAME by ATraceCore like the catch knobs above; Trace.VerifyKnobs checks it.
CoreSurfaceMaxSlopeDegrees=45.000000
; SPEC v13 §8 - "sometimes the core is thrown and it turns over before it touches the
; ground." THE ARRIVAL ANGLE, which is a different question from the SURFACE angle above
; and is why it is a second key rather than a retune of the first. The old rule was, in
; full, "normal.Z >= up threshold" - so a Core grazing the flat top of cover at 1400uu/s,
; 350uu above the floor, presented a perfect V(Z=1.00) and was handed to the nearest
; enemy in mid-flight. Measured on the legacy rule: 7 of 7 graze shots turned over in
; the air; on this one, 0 of 7, and the same contact settles and turns over 132ms later.
;
; The test is |velocity . -normal| / speed >= sin(this). A real drop onto a crate arrives
; at 25-90 deg; the graze that caused the bug measured 11.2 deg. 20 clears every genuine
; landing with room to spare.
;
; 0 RESTORES THE PRE-v13 BUG EXACTLY and is the A/B arm - which is why 0 is legal rather
; than clamped away. A Core that lands shallow and STOPS still turns over on the frame it
; settles, so this only decides whether a still-MOVING contact counts.
; Bound BY NAME by ATraceCore; Trace.VerifyKnobs checks it.
CoreLandingMinDescentDegrees=20.000000

; --- Parry (spec v3 §3, widened by v8 §3, trimmed by v10 §4) ---
; Carrier-only. Grants the TRACE 0.175s of invulnerability and turns the ENTIRE trace
; red for the duration, so an enemy who dashes into it during the window neither
; breaks it nor kills the carrier. The whole mechanic is that number: at 0.175 it is
; still a read of the incoming dash, and at 0.4 it is a panic button that makes the
; dash - the defence's only counterplay - unreliable.
;
; SPEC v10 SECTION 4 ASKED WHETHER THE WINDOW AND THE INVULNERABILITY ARE TWO NUMBERS.
; THEY ARE ONE. There is no separate "press window" in this codebase: a parry is not a
; state you can be caught inside, it is an instantaneous grant. Pressing parry stamps
; ParryEndServerTime = now + ParryDuration on the trail component, and the SAME deadline
; is what makes the trace invulnerable, what tints it red, and what a dash arriving later
; is tested against (UTraceTrailComponent::IsParryActive). So "parry time", "parry
; window" and "parry invulnerability" are three names for ParryDuration, and 0.2 -> 0.175
; here is the whole of v10 §4. ParryCooldown is the only other timer and it is a
; different thing (how soon you may parry AGAIN), so it is deliberately untouched.
; v8 §3 verbatim: "Increase parry time to .2seconds". It does NOT fix the joined
; player's complaint on its own - a client loses the window's ALIGNMENT, not its
; length; see Gameplay/TraceParry.h. It only makes that misalignment survivable.
; The 1.5s cooldown is an [ASSUMPTION]; the notes do not give one. 0.2 in 1.5 is ~13%
; uptime, which keeps spamming it worthless.
;
; ParryTintColor: G and B are near zero AND MUST STAY THAT WAY. The trace is an unlit
; emissive at glow well above 1, so any channel with weight in it clips to white at
; the tonemapper - the exact failure measured when the trace ran at glow 3.4 and
; became "a shapeless white slab". ParryGlowScale sits above the pass window's 1.90
; so the two states are not confusable at a glance.
ParryDuration=0.175000
ParryCooldown=1.500000
ParryGlowScale=2.600000
ParryTintColor=(R=1.000000,G=0.030000,B=0.060000,A=1.000000)
; Spec v6 §3: "Perfectly timed parries should kill the enemy dashing." True = a parry
; that intercepts a dash which WOULD have killed the carrier kills the dasher instead.
; False restores the pre-v6 parry (protects the trace and nothing else). Only a genuinely
; lethal dash is punished - a parry thrown at empty air kills nobody, and that half of the
; rule is enforced by the call site, which is inside the trip test's own "this dash hit
; the lethal trace" branch. Trace.Parry.KillsDasher is the cheat override; negative there
; (the default) means "use this key".
bParryKillsDasher=True

; --- Trail ---
; TrailLethality enumerators: KillsCarrier | KillsToucher | KillsBoth.
; The design rule is asymmetric on purpose: only an ENEMY who is DASHING trips the
; trail, and doing so kills the CARRIER, not the toucher. Flipping either bool to
; False changes the core game, so do it deliberately.
TrailLethality=KillsCarrier
bOnlyEnemiesTripTrail=True
bRequireDashToTripTrail=True
; SPEC v7 §1 - TrailLifetime IS NO LONGER THE EXPIRY RULE. Time-based trail expiry is
; deleted. A stationary carrier used to have their whole trace time out and become
; literally unkillable, the trace being the only way to kill a carrier; now a point
; leaves the tail ONLY when new trace at the head pushes the path past TrailMaxLengthUU.
; This value survives for exactly two jobs: it derives TrailMaxLengthUU when that knob
; is <= 0 (TrailLifetime x WalkSpeed x 0.75), and it is the age-fade reference for the
; LEGACY renderer arm (Trace.Trail.Renderer 0), which is a measurement arm only.
; Do not reintroduce an expiry read of it - a surviving timer restores the exploit.
TrailLifetime=2.000000
; SPEC v7 §2 - "lower the value of trail length (converted from trail time) by 25%".
; 2.0s x 800uu/s = 1600uu, minus 25% = 1200uu. THIS is what retires trail points, and
; the number the whole mechanic now hangs on. <= 0 re-derives it from TrailLifetime;
; Trace.Trail.MaxLength overrides both for a headless measurement run.
TrailMaxLengthUU=1200.000000
TrailPointSpacing=60.000000
; SPEC v7 §3 - the trace is thinner and shallower "in order to make visibility around
; the trace better", and "it doesn't need to be the full width of the player model".
; Radius 45 -> 22.5 (half the player model's width), height 190 -> 63 (the middle third,
; centred on mid-model, which is already where the trace emanates from).
; THESE ARE THE LETHAL NUMBERS AND THE DRAWN NUMBERS AT ONCE - the trip test and every
; renderer arm resolve both through UTraceTrailComponent::GetTraceTrailRadius/Height, so
; visible-but-harmless ribbon and invisible-but-lethal hitboxes are both inexpressible.
; TrailHeight no longer moves the third-person carry camera; see TraceCharacterLayout.
TrailRadius=22.500000
TrailHeight=63.000000

; SPEC v12 SECTION 6 - THE TRACE CLIPPING INTO WALLS (new keys) ----------------------
; Verbatim: "The trace is clipping into walls sometimes, when a model runs close to a
; corner/structure."
;
; [DIAGNOSED] and it is NOT a drawing bug. Points are laid every TrailPointSpacing (60uu)
; of travel and the trace - ribbon AND trip test - is the STRAIGHT CHORD between
; consecutive points. Rounding a pillar the carrier's capsule follows an arc, 60uu of
; which is most of the turn, so the two points straddle the corner and the chord between
; them passes through the pillar. The kill volume takes the identical shortcut.
;
; THE FIX IS SUBDIVISION, NOT DISPLACEMENT: the server inserts positions the carrier
; REALLY OCCUPIED until no segment passes through the level. Nothing is moved off the
; route the player ran - wherever a 34uu capsule legally stood there is room for a
; 22.5uu trace. MaxPush below only cleans up a point already inside something.
;
; *** THE STANDING INVARIANT SURVIVES BY CONSTRUCTION: LETHAL == DRAWN. Both are built
; *** from the same TrailPoints polyline and the fitter edits that polyline, so there is
; *** no second geometry path to keep in agreement by hand. Any future version of this
; *** fix that edited the RIBBON instead would build an invisible kill volume - the worse
; *** of the two failures, and one this project has already shipped a version of.
;
; Each key pairs with the Trace.Trail.WallFit* console variable of the same meaning, and
; must resolve the way TrailRadius does: this file by default, the CVar when the CVar is
; explicitly set. Trace.Trail.WallFit 0 reproduces the reported bug on demand for A/B.
;
; MARGIN IS THE ONE TO WATCH. It is clearance asked for OVER the trace's own half width,
; covering the ribbon's joint overlap and box corners. Push it near the carrier's 34uu
; capsule radius and there are legal routes NO polyline can satisfy: the fitter burns its
; whole insert budget every step, fails, and falls back to the chord - the bug is back
; while the switch still says the fix is on. Sane range 2 to 10.
;
; *** SPEC v13 §7 - THE BUG IS CARRIED OVER AND THE v12 FIX WAS THE WRONG SHAPE. Verbatim:
; *** "Continue to work on the trace clipping into walls bug". Re-measured with the symptom
; *** forced out: fitter OFF gave 26.1uu inside cover on 35.9% of frames, fitter ON gave
; *** 24.2uu on 35.3% - it routed TWICE in 1312 frames. Two things were wrong and both are
; *** fixed on the two lines below.
; ***
; *** 1. IT ONLY TRIGGERED ON A BLOCKED CHORD. The reported bug is the ribbon's own HALF
; ***    WIDTH pressed against a wall the carrier legally ran alongside - the centre line
; ***    is outside the wall the whole way, so no chord is ever blocked and the fitter is
; ***    never asked. bTrailWallClearanceEnabled makes the near-geometry test a SWEEP of
; ***    the trace's half width plus the margin along each segment, so running too close is
; ***    corrected as well as cutting through. False restores the v12 blocked-chord-only
; ***    behaviour, which is the A/B arm that reproduces the residual clipping. With
; ***    bTrailWallFitEnabled=False as a third arm (pre-v12 straight chord) there are three
; ***    readings, which is what it takes to tell "the fix does nothing" apart from "the fix
; ***    is aimed at the wrong thing".
; ***
; *** 2. THE PUSH ALLOWANCE WAS CAPPED BELOW THE PROBLEM: 12uu against a measured 26.1uu of
; ***    penetration. 12 -> 30. The clearance to ask for is TrailRadius (22.5) + Margin (4)
; ***    = 26.5uu and 30 covers it with headroom for a box corner, while staying under the
; ***    carrier's own 34uu capsule radius - the hard ceiling, because a trace that demands
; ***    more room than the body that laid it has legal routes it can never satisfy.
; ***
; *** THE CLEARANCE DISTANCE IS DELIBERATELY NOT A KEY. It is TrailRadius + the margin,
; *** derived where it is used, because TrailRadius is ALSO the half width of the lethal
; *** volume and of the drawn ribbon. A second editable copy of the trace's half width is
; *** exactly how lethal == drawn gets broken by a well-meaning tune.
; ***
; *** THE INVARIANT SURVIVES A BIGGER PUSH BY CONSTRUCTION: the fitter edits TrailPoints,
; *** and the trip test and every renderer arm are both built from TrailPoints, so a point
; *** pushed out of a wall moves the LETHAL volume and the DRAWN volume in one operation.
; *** Pushing further cannot make the trace visible-but-not-lethal or lethal-but-not-
; *** visible; it can only move both. Anything that edits the RIBBON alone breaks that.
bTrailWallFitEnabled=True
bTrailWallClearanceEnabled=True
TrailWallFitMarginUU=4.000000
; *** RAISED 30 -> 44 DURING INTEGRATION, because 30 was still below the requirement and
; *** the code's derived floor - not this key - was the thing actually deciding. The
; *** trace's DRAWN reach is not TrailRadius: PlaceRibbon overlaps interior joints by
; *** another radius, so a box corner stands 22.5*sqrt(2) = 31.8uu from the joint, and
; *** the Catmull-Rom resample overshoots a tight corner by 0.0741 * TrailPointSpacing =
; *** 4.4uu. That is 36.3uu of reach; plus the 4uu margin the fitter asks for 40.3uu.
; *** WallFitMaxPush() floors itself at that figure and logs loudly when it does, so at
; *** 30 the setting was being overridden on every run. 44 puts the authority back here.
; *** Re-derive if TrailRadius or TrailPointSpacing move: this must stay >= reach+margin.
TrailWallFitMaxPushUU=44.000000
TrailWallFitMaxInsert=6

MaxTrailPoints=256
; The newest few points are exempt from the trip test so a carrier cannot be
; killed by the trail it just emitted from its own feet.
TrailHeadGracePoints=3

; TRACE GHOSTS - spec v4 §2: "Change the look of the trace to match the new mannequin
; models, rather than the old cylinder models." The trace is drawn as a run of
; character-shaped after-images instead of a tube.
;
; THESE ARE VISUAL DENSITY DIALS ONLY. The kill volume must still be what the player
; sees, so the trip geometry stays continuous along the whole path however sparse the
; silhouettes are - the ribbon between ghosts is what fills the gaps. Thinning ghosts
; must never thin collision.
;   GhostSpacing 220uu ALONG THE PATH between silhouettes - a distance, not a count of
;                    trail points, because the ghosts want a fixed gap however finely
;                    the path happens to be sampled. A little over one body-depth, so
;                    consecutive mannequins nearly touch and the eye joins them up.
;                    Mirrors the Trace.Trail.GhostSpacing CVar; keep the two equal.
;   MaxGhosts     20 pooled ghosts PER TRACE, and 0 leaves the smear alone. Since spec
;                    v7 §§1-2 a trace is TrailMaxLengthUU long WHATEVER the carrier is
;                    doing - 1200uu, so ~6 ghosts at 220uu spacing, and dashing no
;                    longer stretches it past the cap the way a time window did. 20 is
;                    now generous headroom. Past the cap the OLDEST ghosts are
;                    released, never the newest - the newest are what an approaching
;                    enemy is judging their dash against. Mirrors
;                    Trace.Trail.GhostMaxCount; keep the two equal.
;   GhostGlow    2.6 emissive strength of a silhouette. Above ~3.5 the team colour
;                    clips toward white and you can no longer tell WHOSE trace it is -
;                    which is the same as not knowing whether you may run through it.
;   SmearGlow    0.5 brightness of the continuous smear as a FRACTION of GhostGlow. The
;                    smear is the continuous part of the drawing and the kill volume is
;                    continuous, so this is the dial that decides whether the picture
;                    still agrees with the rule. Do NOT take it low enough that the
;                    gaps between ghosts read as passable; they are not.
;   ForcedLOD      0 automatic (screen-size driven). 1 = LOD0, 2 = LOD1. The biggest
;                    perf lever here if the skinned draws ever measure expensive.
;
; "Mirrors the CVar" is now enforced rather than hoped for: UTraceTrailComponent reads
; these PROPERTIES and only falls back to a Trace.Trail.* CVar when one has been
; explicitly set at runtime or from an ini. Before that wiring the five CVars were the
; only live values and these keys did nothing at all.
;
; SPEC v6 SECTION 2 RETIRED FOUR OF THESE FIVE. The trace is now one continuous curved
; RIBBON (Trace.Trail.Renderer 1, the default) and there are no posed Mannequins in it.
; Spacing, MaxGhosts, SmearGlow and ForcedLOD therefore affect the LEGACY arm only, i.e.
; nothing, unless somebody sets Trace.Trail.Renderer 0 to A/B the old look - which is
; exactly how this pass's performance numbers were measured, which is why they are kept
; rather than deleted. They are labelled "[legacy]" on the settings panel for the same
; reason a dead knob gets fixed here: a slider that looks live and moves nothing is the
; worst thing this file can contain.
; TraceGhostGlow IS still live - it drives the RIBBON's brightness, and it keeps its
; name because it keeps its meaning ("emissive strength of the brightest layer").
; The ribbon's own dials are CVars: Trace.Trail.RibbonStep (resample distance),
; Trace.Trail.RibbonWidthScale (1.0 = exactly the lethal cross-section; lower LIES about
; how much ground kills, so leave it at 1 unless you want a thinner Tron-wall look) and
; Trace.Trail.OwnerHideCameraRadius (how much of your own trace is hidden from your own
; camera).
TraceGhostSpacingUU=220.000000
MaxTraceGhosts=20
TraceGhostGlow=2.600000
TraceSmearGlowScale=0.500000
TraceGhostForcedLOD=0

; --- Tracer: the railgun shot effect (spec v4 §4) ---
; Verbatim: "Remove the sphere from the end of the bullet tracer hitscan animation, so
; it's just a bullet trace, which makes it easier to see where your shots are going.
; Reduce the radius of the cross section of the bullet tracers in order to make them
; thinner."
;
; THE IMPACT SPHERE IS DELETED FROM THE CODE, not switched off here - ATraceTracer has
; no ImpactFlash component any more, so there is no key for it and cannot be one. A
; stale ini cannot bring it back.
;
; WIDTH IS PROPORTIONAL TO THE SHOT'S LENGTH and stayed that way. A constant radius
; cannot work across a 24000+uu arena: anything sane across a corridor is sub-pixel
; across the field. Proportional radius holds the beam at roughly constant ANGULAR
; width from the eye, so "thinner" is the proportion and both clamps halved:
;   RadiusPerLength  0.00310 -> 0.00155
;   RadiusMin        2.50    -> 1.75   (short shots; NOT halved all the way - below
;                                       ~1.2uu a near shot stops resolving at 1280
;                                       wide and "thinner" becomes "invisible")
;   RadiusMax       13.00    -> 6.50   (every shot past ~4200uu sits on this clamp,
;                                       so it is what a cross-map tracer looks like)
; SheathRadiusRatio IS DELIBERATELY UNCHANGED at 3.2. The halo is additive, writes no
; depth and is what your eye finds at range; the thin hard core inside it is what says
; exactly where the shot went. Thinning both together is how a "thinner tracer" change
; ends up as an invisible one.
; The muzzle flash is the OTHER sphere - it sits on the viewmodel, not at the impact,
; and is most of why a first-person shot is visible at all. Kept, halved, and given a
; switch because "the sphere" is ambiguous in the note and this is the reading that can
; be answered without a rebuild.
TracerRadiusPerLength=0.001550
TracerRadiusMinUU=1.750000
TracerRadiusMaxUU=6.500000
TracerSheathRadiusRatio=3.200000
bTracerMuzzleFlash=True
TracerMuzzleRadiusUU=2.500000

; --- Net ---
; MaxRewindTime bounds how far back the server will rewind for hit resolution.
; 0.25s covers ~250ms RTT; beyond that a shooter's claim is rejected rather than
; honoured, which is what stops high-ping players from shooting into the past.
; LagCompHistoryDuration must be >= MaxRewindTime with headroom.
bEnableLagCompensation=True
MaxRewindTime=0.250000
LagCompHistoryDuration=1.000000
bDrawServerRewindDebug=False

; ============================================================================
; SPEC v10 SECTION 1 - THE KNIFE, AS CONFIG
;
; UTraceMeleeSettings (Gameplay/TraceMelee.h) is a UDeveloperSettings with
; config = Game, so THIS is the section it loads from and, by the house rule that
; the ini wins, this is where the shipped knife lives. Every key below was DEAD
; until v10 reconciled it - the class shipped with header literals and no ini
; section at all, which is the "a slider that silently does nothing" failure this
; project keeps a verifier for. Trace.VerifyKnobs now walks this class too and
; Trace.Knife.DumpSettings prints the values in force from a running game.
;
; THE MOVEMENT NUMBERS ARE NOT HERE, AND THERE IS NO LONGER A SECOND COPY OF THEM.
; KnifeMoveSpeedMultiplier and the two air-cap multipliers live in
; [/Script/Trace.TraceSettings] above, beside the WalkSpeed and air caps they
; multiply, and the movement component is their only reader. This section used to
; carry KnifeSpeedMultiplier / KnifeAirCapScale as "this class's own copies"; both
; are deleted, along with the properties behind them. See the Movement note below
; for why, and for the two rows that need removing from the Trace.VerifyKnobs table.
; ============================================================================
[/Script/Trace.TraceMeleeSettings]

; --- Damage. Verbatim: "100 damage if hitting a player in the back... 30 damage
; in the front." One threshold, two tiers, no third "side" case - the spec does not
; specify one, so an approach outside the back cone is simply a front hit.
;
; BackstabHalfAngleDegrees is the half-angle around DIRECTLY BEHIND the victim, so
; 90 meant the whole rear hemisphere of the victim's facing was a back-stab.
;
; SPEC v12 SECTION 1: 90 -> 30. Verbatim: "Change the 'back' zone for knife damage
; being 100 from a boundary at 90 degrees to 60 degrees, with the center of the 60
; angle being at the center of the model."
;
; *** SIXTY IS THE CONE. THIRTY IS THIS KEY. *** The request is a 60-degree cone
; CENTRED on the rear axis, i.e. +/-30 degrees from directly behind. This key is a
; HALF-angle, so it takes 30. Entering 60 here would ship a 120-degree back zone -
; a WIDENING of the instant-kill arc wearing the costume of the narrowing that was
; asked for, and nothing in the build would object: it is inside the 5..179 clamp,
; the ini would parse, Trace.VerifyKnobs would say OK, and only a playtest would
; ever notice. Verify with an azimuth sweep (Trace.Knife.AngleTest), which reports
; the boundary in degrees off the rear axis - it must read 30, not 60.
;
; The back zone goes from "not in front" to a genuine flank: everything outside the
; cone is now the 30-damage front hit, including a strike square on the victim's
; shoulder. THIS KEY WINS OVER THE HEADER LITERAL in Gameplay/TraceMelee.h.
BackstabDamage=100.000000
FrontDamage=30.000000
BackstabHalfAngleDegrees=30.000000

; --- Timing. Verbatim: ".5seconds after a knife swing before a player can knife
; again", "Knife and gun pullout time should be roughly .2seconds."
;
; SwapSeconds is BOTH directions and is a dead window: no shot and no swing while
; it runs, which is what makes swapping a commitment rather than a free cancel.
; SwingWindupSeconds is the lead-in before the blade goes live, so the attack reads
; as an attack; SwingAnimSeconds is the whole animation and must stay under the
; cooldown or a second attack would be legal before the first finished drawing.
;
; SPEC v12 SECTION 2 CHANGED WHAT THESE DRIVE, NOT WHAT THEY ARE CALLED. Verbatim:
; "Take the 3d 'swipe' line animation of the knife out of the player's view. Can you
; make the knife animation a stab instead of a swipe?" So SwingAnimSeconds is now
; thrust-out plus return rather than a lateral arc, and SwingWindupSeconds is the
; lead-in to the thrust. The keys keep their names ON PURPOSE: they are live ini
; keys with tuned values behind them, and renaming a live key is exactly how a tuned
; value silently reverts to a header literal. Two names for one number is the other
; failure this file has already had (see the deleted KnifeSpeedMultiplier note above).
; The stab is PROCEDURAL - Epic's Mannequin ships no stab animation (the imported set
; is Death, Jump, Pistol, Rifle and Unarmed locomotion), so a fast-out/slower-return
; translation of the viewmodel is the motion these two seconds are spent on.
SwingCooldownSeconds=0.500000
SwapSeconds=0.200000
SwingWindupSeconds=0.100000
SwingAnimSeconds=0.320000

; --- Reach. The swing is an ARC, not a hitscan point (spec v10 section 1), so it
; is sampled: SwingSamples rays fanned over SwingArcDegrees out to SwingRangeUU.
;
; SwingSamples IS NOT A TASTE DIAL, IT IS A COVERAGE CONSTRAINT, and it shipped
; wrong. The chord between two adjacent rays at maximum reach is
;
;     2 * SwingRangeUU * sin( radians(SwingArcDegrees) / (2 * (SwingSamples - 1)) )
;
; and it must stay at or under the 34uu capsule radius, or a body can sit BETWEEN
; two rays and take nothing from a swing that visibly passed through it. At 13 that
; chord is 36.6uu - measured by Trace.Knife.AngleTest, which computes it rather
; than estimating it, and which failed on the first headless run of this feature.
; "one ray every ~11 degrees, comfortably finer than a player-width target" was the
; estimate that produced 13 and it is off by the wrong sign: 11 degrees at 180uu is
; wider than a 68uu-wide capsule seen edge-on at that range, not finer.
;
; 15 gives 31.4uu and clears it. Raise SwingRangeUU or SwingArcDegrees and this must
; go up with them - run Trace.Knife.AngleTest afterwards, it checks the arithmetic.
SwingRangeUU=180.000000
SwingArcDegrees=140.000000
SwingSamples=15

; --- Movement. THE KNIFE'S MOVEMENT NUMBERS ARE NOT IN THIS SECTION, and the two
; keys that used to be here (KnifeSpeedMultiplier / KnifeAirCapScale) are DELETED
; along with the properties behind them.
;
; They were this class's own copies of KnifeMoveSpeedMultiplier and the two air-cap
; multipliers in [/Script/Trace.TraceSettings], and the comment that shipped with
; them said the quiet part out loud: "keep them in step with the movement-page pair
; or the HUD and the mover will disagree about how fast a knife carrier is." Two
; numbers that must be kept in step by hand are one bug waiting for a designer to
; drag one slider. Nothing reads these any more - UTraceCharacterMovementComponent
; owns the multipliers (they are saved-move state, round-tripped through
; FSavedMove_Trace so a correction replays each move at the speed it really ran at,
; which a value read from this page could never have given) and the melee slice
; owns only the BIT, pushed through SetKnifeMovementProfileActive().
;
; Trace.Knife.DumpSettings still prints the movement numbers, read back out of the
; movement page, so one command still answers "what does the knife do".
;
; NOTE FOR WHOEVER OWNS TraceSettings.cpp: the Trace.VerifyKnobs table still lists
; KnifeSpeedMultiplier and KnifeAirCapScale on this class and will now report them
; DEAD, correctly. Delete those two rows.

; --- Bots. "Bots must use it, or it will not be playtested." Engage < disengage on
; purpose: equal values would make a bot at exactly that range swap weapons every
; frame. BotSwingRangeFraction keeps the bot swinging INSIDE its own reach rather
; than at the very edge of it, where a target that is still closing would step out
; of the arc during the windup.
;
; 700/950 -> 500/750 AFTER MEASUREMENT. A bot holding the knife CANNOT SHOOT, so
; the engage range is exactly how far a bot voluntarily disarms itself for. At 700
; the first headless bot match had bots dropping the gun at comfortable gun range
; and spending most of an engagement unarmed - the blade only reaches 180uu. 500uu
; is 0.31s of closing at the knife's 1040 uu/s, which reads as committing to a
; finisher. If bot lethality moves this pass, this is the first number to look at.
BotEngageRangeUU=500.000000
BotDisengageRangeUU=750.000000
BotSwingRangeFraction=0.850000

; ==============================================================================
; HEALTH REGENERATION (spec v13 section 1)
;
; Verbatim: "Add a healing timer. After 9 seconds without taking damage,
; characters' health slowly begins to regenerate. Taking damage stops this
; process immediately."
;
; THIS BLOCK IS THE ONE THAT DECIDES. It is layered over the C++ initialisers in
; Source/Trace/Gameplay/TraceHealthComponent.h at startup, so editing only the
; header would change nothing at runtime. Read the resolved values back from a
; running game with Trace.Health.DumpSettings, which prints the table value, any
; console override, and the seconds a full 0 -> MaxHealth heal takes.
;
; RegenDelaySeconds is the user's number, not a starting point. It is measured
; from damage that actually LANDED - a bullet dropped by carrier invulnerability
; is not damage taken and deliberately does not restart it.
;
; RegenRatePerSecond 10 is the [ASSUMPTION]: 0 -> 100 in ten seconds. In the
; units of the guns that oppose it, a body shot is 40 (three to kill), so this
; buys back one body shot per four seconds of not being shot; the 9s delay is
; what makes that a reward for disengaging rather than for winning a trade.
;
; The mid-fight arm is the CVar Trace.Health.Regen (1 shipped, 0 removes the
; mechanic so Trace.Health.RegenTest can be shown going RED). bRegenEnabled here
; is the designer's switch and both have to agree for regen to run.
; ==============================================================================
[/Script/Trace.TraceHealthSettings]
bRegenEnabled=True
RegenDelaySeconds=9.000000
RegenRatePerSecond=10.000000
