; ============================================================================
; Trace - project & gameplay configuration
;
; Anything whose UCLASS declares `config=Game` is read from this file. That
; includes UTraceSettings (UCLASS(config=Game, defaultconfig)) - its tunables are
; at the bottom of this file, NOT in DefaultEngine.ini.
; ============================================================================

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=B6EF84B0-ACD0-4545-A258-1E680F1C21CE
ProjectName=Trace
ProjectVersion=0.1.0
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "Trace")
Description=5v5 arena prototype. One shared Core, an invulnerable carrier laying a lethal trail, and dash as the only counterplay. Server-authoritative with client-side prediction and server-side rewind.
CompanyName=
bShouldWindowPreserveAspectRatio=True
bUseBorderlessWindow=False
bStartInVR=False
bAllowWindowResize=True
bAllowClose=True
bAllowMaximize=True
bAllowMinimize=True

; ----------------------------------------------------------------------------
; Session sizing - 5v5 plus a couple of spectator slots.
; UTraceSettings.PlayersPerTeam is the gameplay-side team cap; this is the
; connection-side cap the engine enforces at login. Keep them consistent:
; MaxPlayers should be at least PlayersPerTeam * 2.
; ----------------------------------------------------------------------------
[/Script/Engine.GameSession]
MaxPlayers=10
MaxSpectators=2
MaxSplitscreensPerConnection=1
bRequiresPushToTalk=True

; ----------------------------------------------------------------------------
; Packaging / cooking
;
; DirectoriesToAlwaysCook is load-bearing, not decoration. Every visual in this
; project is an /Engine/BasicShapes mesh. Constructor-time FObjectFinder refs are
; followed by the cooker, but any runtime LoadObject path is NOT - it would return
; nullptr in a packaged build. Cooking the whole directory makes that class of bug
; impossible regardless of how a mesh gets referenced.
; ----------------------------------------------------------------------------
[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
UsePakFile=True
bCompressed=True
bSkipEditorContent=False
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+MapsToCook=(FilePath="/Game/Maps/Arena")

; ============================================================================
; UTraceSettings - runtime gameplay tuning (Project Settings > Game > Trace Gameplay)
;
; These are the contract defaults written out explicitly so the team can retune
; the whole game without recompiling. They must stay in sync with the C++
; defaults in TraceSettings.h; where they differ, THIS FILE WINS at runtime.
; Values are read on the CDO, so changes require an editor/game restart (or a
; hot-reload of config), not a rebuild.
; ============================================================================
[/Script/Trace.TraceSettings]

; --- Match ---
ScoreToWin=5
; LEGACY. The match is two halves now (spec §1); ATraceGameMode::HalfDuration is the
; enforced length of each. Nothing in the rules reads MatchDuration any more.
MatchDuration=600.000000
PlayersPerTeam=5
MinPlayersToStart=2
; Spec §1: 3 seconds, and players respawn in their own endzone. The ENFORCED value
; is ATraceGameMode::RespawnDelay (config=Game, [/Script/Trace.TraceGameMode]);
; this one is only a client-side fallback for the death panel's countdown before
; the authoritative deadline in ATracePlayerState has replicated. Keep them equal.
RespawnDelay=3.000000
WarmupDuration=5.000000

; --- Bots (singleplayer) ---
; bFillTeamsWithBots tops BOTH teams up to PlayersPerTeam, so one human gets a
; real 5v5: 1 human + 4 AI vs 5 AI. Turn it off here for a humans-only session,
; or per-session with the URL option "?bots=0" (which always wins over this).
;
; BotsPerTeam=-1 means "however many it takes to reach PlayersPerTeam". That is
; a target ROSTER size rather than a bot count, which is what makes the fill
; self-correcting: a second human joining evicts a bot instead of making 11.
;
; Difficulty is NO LONGER set by the five Bot* floats below. They are retained
; only so existing configs still load; ATraceBotController reads none of them.
; The live knobs are the three FTraceBotProfile blocks (BotEasy / BotNormal /
; BotHard, 21 values each) defined in UTraceSettings, selected by BotDifficulty
; or by "?difficulty=easy|normal|hard" on the travel URL that the title screen
; writes. Editing BotAimErrorDegrees here changes nothing; edit the profile.
;
; BotTrailDashRange must stay well under the dash's own reach, DashSpeed *
; DashDuration = 2600 * 0.18 = 468uu, or the dash stops short of the trail and
; the signature kill never lands.
bFillTeamsWithBots=True
BotsPerTeam=-1
MaxBots=16
BotReactionTime=0.320000
BotAimErrorDegrees=4.500000
BotAggression=0.750000
BotDecisionInterval=0.200000
BotSightRange=6000.000000
BotPreferredCombatRange=1600.000000
BotTrailDashRange=420.000000
BotPassChance=0.350000

; --- Combat ---
; DAMAGE IS POSITIONAL NOW (spec §6): head 100 / body 40 / legs 25, three body
; shots to kill at 100 health. Those three numbers live in UTraceDamageSettings
; ([/Script/Trace.TraceDamageSettings]), which is the single definition shared by
; the client's predicted trace and the server's rewound one.
;
; HitscanDamage and HeadshotMultiplier were the old flat-damage model and are
; READ BY NOTHING. Deleted rather than zeroed, so nobody retunes a dead knob and
; wonders why the game ignores them.
MaxHealth=100.000000
; Spans the 24000 x 12000 arena's ~26833uu diagonal. At the old 15000 a shot down
; a long lane expired in mid-air short of a target the player could plainly see.
; Bots are unaffected: their MaxEngagementRange caps at 5000 (Hard).
HitscanRange=28000.000000
FireInterval=0.120000
bFriendlyFire=False
; Spec §6: "There is no movement inaccuracy. Set spread to 0." UTraceWeaponComponent
; no longer reads this at all - the shot IS the aim ray - but 0 is kept here so the
; file does not misrepresent the design.
SpreadDegrees=0.000000

; --- Movement ---
; The carrier is slightly FASTER than everyone else (1.08x): the carrier cannot
; shoot and is hunted by five people, so the speed edge is what makes carrying
; playable. Dash covers 2600 * 0.18 = ~468 uu, roughly a third of the field width.
;
; The dash is CHARGED, not timed. Everyone holds BaseDashCharges; the Core carrier
; holds one more for as long as they carry it, and the pool refills one charge at a
; time, each on DashCooldown measured from the dash that spent it. Contract §5.
;
; Crouch is context-sensitive: on the ground it slides, in the air it zeroes positive
; Z velocity (a fast-fall). Boost is a separate bind and is ground-only.
WalkSpeed=720.000000
CarrierSpeedMultiplier=1.080000
DashSpeed=2600.000000
DashDuration=0.180000
DashCooldown=4.000000
BaseDashCharges=1
CarrierExtraDashCharges=1
SlideEntrySpeedFraction=0.550000
SlideSpeedMultiplier=1.450000
SlideMaxSpeed=1500.000000
SlideDuration=1.000000
SlideDeceleration=750.000000
SlideExitSpeedFraction=0.600000
SlideTurnRateDegrees=130.000000
SlideCooldown=0.600000
SlideInputBufferSeconds=0.250000
BoostZVelocity=1150.000000
BoostCooldown=12.000000

; --- Core ---
PassSpeed=2400.000000
PassUpwardBias=0.140000
PickupRadius=110.000000
PickupLockoutAfterThrow=0.350000
CoreResetTime=15.000000

; --- Trail ---
; TrailLethality enumerators: KillsCarrier | KillsToucher | KillsBoth.
; The design rule is asymmetric on purpose: only an ENEMY who is DASHING trips the
; trail, and doing so kills the CARRIER, not the toucher. Flipping either bool to
; False changes the core game, so do it deliberately.
TrailLethality=KillsCarrier
bOnlyEnemiesTripTrail=True
bRequireDashToTripTrail=True
; Spec §3: 4 seconds, down from 6. UTraceTrailComponent additionally clamps to 4 as
; a CEILING, so a stale config cannot reinstate the old rule - but the bots' trail
; interception tuning (BotTrailMinPointLifeRemaining) is calibrated against 4, so
; changing this changes how well they hunt.
TrailLifetime=4.000000
TrailPointSpacing=60.000000
TrailRadius=45.000000
TrailHeight=190.000000
MaxTrailPoints=256
; The newest few points are exempt from the trip test so a carrier cannot be
; killed by the trail it just emitted from its own feet.
TrailHeadGracePoints=3

; --- Net ---
; MaxRewindTime bounds how far back the server will rewind for hit resolution.
; 0.25s covers ~250ms RTT; beyond that a shooter's claim is rejected rather than
; honoured, which is what stops high-ping players from shooting into the past.
; LagCompHistoryDuration must be >= MaxRewindTime with headroom.
bEnableLagCompensation=True
MaxRewindTime=0.250000
LagCompHistoryDuration=1.000000
bDrawServerRewindDebug=False
