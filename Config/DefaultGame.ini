; *** DEMO 29 ITEM 7: "Make Roxie's rocket hit radius match the model." 45 -> 72. ***
;
; THE ONE RADIUS. This single key is now the rocket's touch radius (how close the
; flight path must come to a pawn to be a DIRECT IMPACT), the radius of the DRAWN
; model, the radius of the sphere that stops it on a wall, AND the radius of the
; Demo 29 blast falloff - which is also the radius ATraceFxBurst already drew the
; RocketBurst at, because it reads this same key. Four things, one number, so no
; two of them can be edited apart again.
;
; 72 IS THE MODEL'S SIZE, KEPT. Patch 28 answered "make the rocket larger" with a
; drawn-only x1.6 multiplier, which left a 72 uu picture around a 45 uu projectile.
; The pass argued that was safe (a 72 uu skin is inside the 45+34 = 79 uu volume a
; player actually dies in) and Trace.Roxie.RocketFlightTest asserted it and passed.
; The owner played it and said the hit radius did not match the model. The model was
; the size they had chosen, so the model won and the hit radius came up to meet it.
;
; The cost, stated: the volume a player dies in goes 79 -> 106 uu about the flight
; line, so the rocket is easier to land than it was in Demo 28. That is the same
; sentence's other half - it is easier to touch somebody, and only a real hit does
; the full 100.
RoxieRocketHitRadiusUU=72.000000
; *** DEMO 29 ITEM 7: "Otherwise, the damage should fall off." A NEW KEY. ***
;
; The fraction of RoxieRocketDamage taken by a pawn standing exactly ON the point the
; rocket ended at - the best possible near miss. It falls from there to ZERO at
; RoxieRocketHitRadiusUU above, on a smoothstep (zero slope at both ends: no cliff at
; the boundary, and a consistent payout for the best near miss, which matters because
; this rocket wobbles on purpose and a straight ramp would charge a player twice for
; the same inaccuracy). The distance is measured to the victim's CAPSULE SURFACE, not
; to their actor origin, which sits about 88 uu above their feet.
;
; At 0.500000 the measured table is:
;     DIRECT IMPACT (the projectile hit them)  100.0
;     gap  0 uu (standing in it)                50.0
;     gap 18 uu (25% of the radius)             42.2
;     gap 36 uu (50%)                           25.0
;     gap 54 uu (75%)                            7.8
;     gap 72 uu (the edge of the drawn burst)    0.0
;     beyond that                                0.0
;
; 0.000000 IS THE RED ARM and restores the Demo 28 build exactly - a rocket landing at
; your feet does nothing at all. The clamp stops at 0.950000 on purpose: a splash that
; could reach 1.0 would let a near miss equal a direct hit, which is the distinction
; item 7 exists to create.
;
; THERE IS NO SELF-DAMAGE KEY AND THERE CANNOT USEFULLY BE ONE. Roxie's own blast deals
; her 0 at every range including point blank, because the ability framework's choke
; point refuses a pawn damaging itself with its own ability. Her rocket jump costs what
; it has always cost: nothing.
RoxieRocketSplashMaxFraction=0.500000
