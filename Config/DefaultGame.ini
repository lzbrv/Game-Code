;
; This was the drawn-only size multiplier Patch 28 raised to 1.600000 to make the model
; larger. Demo 29 item 7 asked for the hit radius to MATCH the model, and a multiplier
; is exactly the mechanism by which those two drift apart, so the drawn radius is now
; the hit radius above and this multiplies nothing. It is left here, at 1.000000, so a
; config or a saved settings page carrying the key still loads and so the work is
; recoverable; editing it will move the settings slider and change nothing in the game.
;
; TO RESTORE IT: put GetVisualScale() back beside GetHitRadiusUU() in TraceRoxieRocket.cpp
; and make GetVisualRadiusUU() return the product again. Two lines, one file.
