; SPEC v18 SECTION 2 - ROXIE, ELLE AND SLIMEBALL
;
; Every one of these keys is EQUAL TO THE HEADER DEFAULT the three characters
; shipped on, so adding this block changes nothing a player can feel. What it
; changes is who can retune them: on this project the ini wins over the header,
; and a knob with no ini line is a knob a designer cannot touch without a
; rebuild. The five original characters have had their block here since v14 and
; these three had none, which is the same gap the v16 ammo knobs sat in for a
; pass.
