;
; *** PATCH 28 ITEM 2 TURNED THE WALL 90 DEGREES AND MOVED NONE OF THESE FOUR
; NUMBERS. *** Verbatim: "Slimeball's slimewall should be placed forward instead of
; laterally in front of him." The LENGTH used to run ACROSS his aim (a 1100 uu
; barrier facing him, 176 thick - the wall you hide behind); it now runs ALONG it,
; so the wall is a 176 x 176 cross-section - one player tall and one player wide,
; which is what section 2 asks for in as many words - extending 1100 uu away from
; him. It is the wall you run beside, and it splits a lane instead of capping it.
;
; SlimewallRangeUU CHANGED MEANING AND NOT VALUE: it was the distance to the wall's
; CENTRE, and it is now the distance to its NEAR END, so "the wall starts 400 uu in
; front of me" still reads the same. Its centre is 400 + 1100/2 = 950 uu ahead and
; its far end 1500 uu ahead. If something is in the lane the run is SHORTENED to
; stop at it (the old lateral wall pulled itself back instead - a forward wall
; cannot, because its long axis points into the obstacle); a run shorter than the
; 176 uu thickness is refused as a FREE FIZZLE rather than placed as a block.
SlimewallHeightUU=176.000000
SlimewallWidthUU=176.000000
SlimewallLengthUU=1100.000000
SlimewallRangeUU=400.000000
SlimewallSlowFraction=0.350000
; NOT a spec number. At 176 uu thick an enemy at 800 uu/s is inside for 0.22 s, so
; a slow that ended at the far face would be imperceptible and the ability would
; read as broken.
SlimewallSlowLingerSeconds=0.750000
SlimewallDurationSeconds=4.000000
; A BRIGHTNESS, not a transparency - the slab's material is opaque (same reason as
; ElleCloakOpacity above). It NEVER blocks bullets: section 2's "can be shot
; through" is enforced by the slab having no collision on any channel at all.
SlimewallOpacity=0.900000
bSlimewallSlowsOwnTeam=False
SlimewallCooldownSeconds=25.000000

; --- Mortimer. DEMO 20 ITEM 2, verbatim: "Change mortimer's dash to be 40% of a
;     normal one instead of 25%, but increase mortimer's dash cooldown by 25%".
;     DEMO 21 ITEMS 6 (the mantle) and 7 (the throw past 100%).
;
; ONLY THE KEYS A DEMO ACTUALLY MOVES ARE WRITTEN HERE. The rest of his kit (the
; throw charge cap, the six Quake numbers) is still on the header defaults in
; TraceSettings.h, which is where they were set and where they are still correct.
; Adding them here would create a second place to change them.
;
; *** WHY THIS BLOCK EXISTS AT ALL. *** The Mortimer section of TraceSettings.h
; used to say "NO ini LINES - these take their C++ defaults", and it was true.
; The previous pass moved the header and nothing else, and a verifier reported the
; new number while the game kept playing the old one, because on this project the
; ini beats the header. Both are now written and both say the same thing. IF YOU
; CHANGE ONE, CHANGE THE OTHER, or the game plays a number nobody can find by
; reading the C++.
;
; 0.250000 -> 0.400000. Reach is DashSpeed x DashDuration = 3300 x 0.18 = 594 uu,
; so his dash goes 149 uu -> 238 uu. It scales the dash's SPEED and not its
; DURATION on purpose: the duration is what the dash trail, the parry window and
; the dash-hit sweep are measured against, and shortening it would quietly retune
; three systems the owner did not ask about.
MortimerDashDistanceScale=0.400000
;
; NEW KEY. 1.25 = 25% longer than everybody else's DashCooldown (3.500000, set
; near the top of this section), i.e. 4.375 s for him alone. A MULTIPLIER rather
; than the number 4.375 so a retune of the shared cooldown carries him with it.
;
; *** THIS KEY IS LIVE. *** These lines said "NOT LIVE YET" for a whole demo after
; UTraceCharacterMovementComponent::GetDashCooldown() started multiplying by
; TraceAbilityTraits::GetDashCooldownScale(). Trace.Mortimer.DashTest MEASURES it
; on a live pawn; believe that command rather than this comment.
MortimerDashCooldownScale=1.250000
;
; --- DEMO 21 ITEM 7, verbatim: "after the original 100% charge window has passed,
;     add a .6x modifier to the linear scaling of his throw charge".
;
; It scales ONLY the charge accumulated past the original 100% point:
;   EffectiveT = min(t,1) + 0.6 x clamp(t-1, 0, MortimerThrowChargeHoldScale-1)
;   Power      = CoreThrowChargeFloorFraction + (1-Floor) x EffectiveT
; so up to 100% he is byte-identical to the other nine (the scaled term is zero
; there) and past it every extra second of hold is worth 60% of what it was.
;
; A FRACTION OF THE SHARED LINE, NOT A SLOPE OF HIS OWN. Retuning
; CoreThrowChargeFloorFraction (0.150000) or CoreThrowChargeSeconds (0.600000)
; moves his extended half with everybody's base half automatically - the standing
; rule the owner added this patch. 1.000000 here is the arithmetic red arm and
; reproduces the pre-Demo-21 throw exactly; Trace.Mortimer.ThrowPastFull 0 is the
; CVar red arm and does the same thing without touching the ini.
;
; MEASURED: at hold scale 2 and floor 0.15 his full extended charge goes x1.85 ->
; x1.51 launch speed, which is about 3.42x -> 2.28x the RANGE of a full-charge
; throw (the loose Core is integrated under gravity with no drag, so range goes as
; speed squared). Trace.Mortimer.ThrowTest throws four real Cores and measures it.
;
; PATCH 28 ITEM 4 ("reduce core throw speed max to 2900uu/s, adjusting Mortimer
; accordingly") DID NOT TOUCH EITHER OF HIS TWO KEYS, and that is the correct answer
; rather than an omission: both are FRACTIONS of the shared curve, so lowering
; CoreThrowSpeed from 3300 to 2900 carried his throw from 3714.1 to 3263.9 uu/s and
; his flat range from 8241 to 6364 uu without a Mortimer-side edit. x1.51 is still
; x1.51. Re-tuning one of these keys instead would have made his passive a second
; opinion about a number the base already owns - the Chut backstab-damage bug shape.
MortimerThrowChargePastFullScale=0.600000
;
; --- DEMO 21 ITEM 6, verbatim: "Add a mantle for Mortimer, as the original
;     instructions requested. It doesn't have to be the old mantle - make a new
;     one which acts the same, but for just him."
;
; bMortimerCanMantle and MortimerMantleGenerosity are NOT written here - they are
; still on their header defaults (True / 1.300000) because Demo 21 does not move
; them. The two below ARE written because they are new keys whose values were
; chosen this pass, and because they are the pair a designer will want to retune
; first.
;
; BOTH ARE MULTIPLES OF A LIVE BASE, NOT uu. Reach is capsule radii (34 uu today),
; the ceiling is jump apexes (JumpZVelocity 640 under MovementGravityScale 1.120000
; = ~187 uu today). The legacy mantle stored 70 uu and 230 uu flat, so a capsule or
; jump retune would have left the mantle behind; expressed like this it follows.
; 34 x 2.8 x 1.3 = 124 uu of reach (legacy 125) and 187 x 1.23 x 1.3 = 298 uu of
; ceiling (legacy 299).
MortimerMantleReachRadii=2.800000
MortimerMantleApexReach=1.230000
;
; Rate limit only, so a held jump key cannot re-probe every frame. The legacy value.
MortimerMantleCooldownSeconds=0.350000

; --- Lily. Spec v19 section 3 as amended by DEMO 19 items 4 and 8. Only the two
;     keys DEMO 19 actually moves are written here; the rest of her kit is still
;     on the header defaults in TraceSettings.h, which is where they were set and
;     where they are still correct.
;
; *** ITEM 4: "half the speed she moves vertically at". *** Both scales go 1.0 ->
; 0.5, so against the shipped WalkSpeed of 800 she climbs and descends at 400
; uu/s. They are MULTIPLES OF WalkSpeed and not the number 400 on purpose - a
; retune of the walk should carry the flight with it rather than leave the two
; drifting apart.
;
; "Vertically", not "upwards", so the descent halves with the climb and Zip stays
; the symmetric control a player can learn as one number.
;
; THIS FILE BEATS THE HEADER. Both are set to 0.5; if you change one, change both,
; or the game plays a number nobody can find by reading the C++.
LilyZipClimbSpeedScale=0.500000
LilyZipDescendSpeedScale=0.500000
;
; ITEM 8 - "only has an extra dash when she is not carrying the core" - is NOT a
; key. The knob stays 1 (one extra charge, an addend on everybody's pool) and the
; CONDITION lives in UTraceAbilitySetLily::GetExtraDashCharges(), which returns 0
; while she is carrying. Writing it as a number here would have hidden a rule
; inside a quantity. Trace.Lily.DashTest proves it, red arm first.

; ============================================================================
; SPEC v10 SECTION 1 - THE KNIFE, AS CONFIG
;
; UTraceMeleeSettings (Gameplay/TraceMelee.h) is a UDeveloperSettings with
; config = Game, so THIS is the section it loads from and, by the house rule that
; the ini wins, this is where the shipped knife lives. Every key below was DEAD
; until v10 reconciled it - the class shipped with header literals and no ini
; section at all, which is the "a slider that silently does nothing" failure this
; project keeps a verifier for. Trace.VerifyKnobs now walks this class too and
; Trace.Knife.DumpSettings prints the values in force from a running game.
;
; THE MOVEMENT NUMBERS ARE NOT HERE, AND THERE IS NO LONGER A SECOND COPY OF THEM.
; KnifeMoveSpeedMultiplier and the two air-cap multipliers live in
; [/Script/Trace.TraceSettings] above, beside the WalkSpeed and air caps they
; multiply, and the movement component is their only reader. This section used to
; carry KnifeSpeedMultiplier / KnifeAirCapScale as "this class's own copies"; both
; are deleted, along with the properties behind them. See the Movement note below
; for why, and for the two rows that need removing from the Trace.VerifyKnobs table.
; ============================================================================
[/Script/Trace.TraceMeleeSettings]

; --- Damage. Verbatim: "100 damage if hitting a player in the back... 30 damage
; in the front." One threshold, two tiers, no third "side" case - the spec does not
; specify one, so an approach outside the back cone is simply a front hit.
;
; BackstabHalfAngleDegrees is the half-angle around DIRECTLY BEHIND the victim, so
; 90 meant the whole rear hemisphere of the victim's facing was a back-stab.
;
; SPEC v12 SECTION 1: 90 -> 30. Verbatim: "Change the 'back' zone for knife damage
; being 100 from a boundary at 90 degrees to 60 degrees, with the center of the 60
; angle being at the center of the model."
;
; *** SIXTY IS THE CONE. THIRTY IS THIS KEY. *** The request is a 60-degree cone
; CENTRED on the rear axis, i.e. +/-30 degrees from directly behind. This key is a
; HALF-angle, so it takes 30. Entering 60 here would ship a 120-degree back zone -
; a WIDENING of the instant-kill arc wearing the costume of the narrowing that was
; asked for, and nothing in the build would object: it is inside the 5..179 clamp,
; the ini would parse, Trace.VerifyKnobs would say OK, and only a playtest would
; ever notice. Verify with an azimuth sweep (Trace.Knife.AngleTest), which reports
; the boundary in degrees off the rear axis - it must read 30, not 60.
;
; The back zone goes from "not in front" to a genuine flank: everything outside the
; cone is now the 30-damage front hit, including a strike square on the victim's
; shoulder. THIS KEY WINS OVER THE HEADER LITERAL in Gameplay/TraceMelee.h.
BackstabDamage=100.000000
FrontDamage=30.000000
BackstabHalfAngleDegrees=30.000000

; --- Timing. Verbatim: ".5seconds after a knife swing before a player can knife
; again", "Knife and gun pullout time should be roughly .2seconds."
;
; SwapSeconds is BOTH directions and is a dead window: no shot and no swing while
; it runs, which is what makes swapping a commitment rather than a free cancel.
; SwingWindupSeconds is the lead-in before the blade goes live, so the attack reads
; as an attack; SwingAnimSeconds is the whole animation and must stay under the
; cooldown or a second attack would be legal before the first finished drawing.
;
; SPEC v12 SECTION 2 CHANGED WHAT THESE DRIVE, NOT WHAT THEY ARE CALLED. Verbatim:
; "Take the 3d 'swipe' line animation of the knife out of the player's view. Can you
; make the knife animation a stab instead of a swipe?" So SwingAnimSeconds is now
; thrust-out plus return rather than a lateral arc, and SwingWindupSeconds is the
; lead-in to the thrust. The keys keep their names ON PURPOSE: they are live ini
; keys with tuned values behind them, and renaming a live key is exactly how a tuned
; value silently reverts to a header literal. Two names for one number is the other
; failure this file has already had (see the deleted KnifeSpeedMultiplier note above).
; The stab is PROCEDURAL - Epic's Mannequin ships no stab animation (the imported set
; is Death, Jump, Pistol, Rifle and Unarmed locomotion), so a fast-out/slower-return
; translation of the viewmodel is the motion these two seconds are spent on.
;
; *** SPEC v31 SECTION 1 SPLIT THE PULLOUT IN TWO, AND ONLY ONE OF THEM IS A
; *** NUMBER. *** Verbatim: "Reduce the pullout time when swapping to knife by
; 35%. Keep the pullout time for the guns the same."
;
; SwapSeconds stays 0.2 and is now THE BASE: it is what a pistol costs, what an
; SMG costs, and what a knife->gun swap costs. KnifeSwapMultiplier below is the
; knife's share of it - 0.65, i.e. 35% shorter, which resolves to 0.130s.
;
; THERE IS DELIBERATELY NO KnifeSwapSeconds KEY, for exactly the reason this file
; already refuses a SmgSwapSeconds key 2100 lines above: a value that MODIFIES a
; base is stored RELATIVE to that base. Retune SwapSeconds to 0.25 and the knife
; becomes 0.1625 on its own; write 0.130 as an absolute here instead and the
; knife would stay at 0.130 and quietly stop being "35% shorter" at all.
;
; TraceMelee::GetSwapSecondsFor(Weapon) is the only resolver and multiplies on the
; DESTINATION of the swap, so pulling the knife OUT is fast and putting it away is
; a normal gun pullout. Read both back from a running game with
; Trace.Knife.DumpSettings, which prints the pair and the multiplier together.
SwingCooldownSeconds=0.500000
SwapSeconds=0.200000
KnifeSwapMultiplier=0.650000
SwingWindupSeconds=0.100000
SwingAnimSeconds=0.320000

; --- Reach. The swing is an ARC, not a hitscan point (spec v10 section 1), so it
; is sampled: SwingSamples rays fanned over SwingArcDegrees out to SwingRangeUU.
;
; SwingSamples IS NOT A TASTE DIAL, IT IS A COVERAGE CONSTRAINT, and it shipped
; wrong. The chord between two adjacent rays at maximum reach is
;
;     2 * SwingRangeUU * sin( radians(SwingArcDegrees) / (2 * (SwingSamples - 1)) )
;
; and it must stay at or under the 34uu capsule radius, or a body can sit BETWEEN
; two rays and take nothing from a swing that visibly passed through it. At 13 that
; chord is 36.6uu - measured by Trace.Knife.AngleTest, which computes it rather
; than estimating it, and which failed on the first headless run of this feature.
; "one ray every ~11 degrees, comfortably finer than a player-width target" was the
; estimate that produced 13 and it is off by the wrong sign: 11 degrees at 180uu is
; wider than a 68uu-wide capsule seen edge-on at that range, not finer.
;
; 15 gives 31.4uu and clears it. Raise SwingRangeUU or SwingArcDegrees and this must
; go up with them - run Trace.Knife.AngleTest afterwards, it checks the arithmetic.
SwingRangeUU=180.000000
SwingArcDegrees=140.000000
SwingSamples=15

; --- Movement. THE KNIFE'S MOVEMENT NUMBERS ARE NOT IN THIS SECTION, and the two
; keys that used to be here (KnifeSpeedMultiplier / KnifeAirCapScale) are DELETED
; along with the properties behind them.
;
; They were this class's own copies of KnifeMoveSpeedMultiplier and the two air-cap
; multipliers in [/Script/Trace.TraceSettings], and the comment that shipped with
; them said the quiet part out loud: "keep them in step with the movement-page pair
; or the HUD and the mover will disagree about how fast a knife carrier is." Two
; numbers that must be kept in step by hand are one bug waiting for a designer to
; drag one slider. Nothing reads these any more - UTraceCharacterMovementComponent
; owns the multipliers (they are saved-move state, round-tripped through
; FSavedMove_Trace so a correction replays each move at the speed it really ran at,
; which a value read from this page could never have given) and the melee slice
; owns only the BIT, pushed through SetKnifeMovementProfileActive().
;
; Trace.Knife.DumpSettings still prints the movement numbers, read back out of the
; movement page, so one command still answers "what does the knife do".
;
; NOTE FOR WHOEVER OWNS TraceSettings.cpp: the Trace.VerifyKnobs table still lists
; KnifeSpeedMultiplier and KnifeAirCapScale on this class and will now report them
; DEAD, correctly. Delete those two rows.

; --- Bots. "Bots must use it, or it will not be playtested." Engage < disengage on
; purpose: equal values would make a bot at exactly that range swap weapons every
; frame. BotSwingRangeFraction keeps the bot swinging INSIDE its own reach rather
; than at the very edge of it, where a target that is still closing would step out
; of the arc during the windup.
;
; 700/950 -> 500/750 AFTER MEASUREMENT. A bot holding the knife CANNOT SHOOT, so
; the engage range is exactly how far a bot voluntarily disarms itself for. At 700
; the first headless bot match had bots dropping the gun at comfortable gun range
; and spending most of an engagement unarmed - the blade only reaches 180uu. 500uu
; is 0.31s of closing at the knife's 1040 uu/s, which reads as committing to a
; finisher. If bot lethality moves this pass, this is the first number to look at.
BotEngageRangeUU=500.000000
BotDisengageRangeUU=750.000000
BotSwingRangeFraction=0.850000

; ==============================================================================
; ***          T H E   O N E   S W I T C H   (spec v28 section 10)           ***
; ***            *** FLIPPED TO False BY SPEC v31 SECTION 1 ***             ***
; ==============================================================================
;
; v31 s1: "Revert the knife changes (no dual wielding)." This key is the revert.
; It was flipped and NOTHING ELSE in the [DUALWIELD] inventory was edited - the
; whole change is the word on the bDualWieldKnife line at the bottom of this
; block, plus the identical flip of the header initialiser in TraceMelee.h (the
; ini wins, but changing only one of the two is how a "flip" silently does
; nothing on a machine with no ini). Read the right-hand column below for what
; the build now does.
;
; ONE THING THE SWITCH DID NOT COVER, AND IT IS A REAL DEFECT IN IT. The
; "1 = pistol, 2 = SMG / 1 = knife, 2 = gun" row went stale in v29 s5, which
; DELETED the 1/2 remap the switch used to own (the deletion note is still in
; TraceMelee::RequestEquipIfDifferent). Since then the switch has had no opinion
; about keys at all, so flipping it restored the knife as a weapon slot and left
; the keyboard on v29's stow layout. The v31 s1 layout - 1 pistol, 2 SMG, 3 knife
; - was laid out by hand in Settings/TraceUserSettings.cpp with the usual ConfigId
; migration, and that row below is corrected rather than left lying.
;
; Verbatim: "Knives are being changed so that you can dual wield them with a gun.
; Gun in one hand, knife in the other. Melee should be bound to right click by
; default. [...] But you no longer have to swap between knife and gun, just the
; different guns. Make these knife changes easy to revert with one prompt."
;
; *** SET THIS TO False AND THE BUILD IS THE v27 KNIFE GAME AGAIN. *** That is the
; whole revert. Nothing else in this file, and no source file, has to be touched.
; The same answer can be forced without editing anything, for a one-off run:
;
;     Trace.Knife.DualWield 0        console, live
;     -TraceLegacyKnife              launch flag, e.g. on run-practice-range.sh
;
; WHAT FLIPPING IT DOES, in one line each. The full contract with the reasoning is
; on UTraceMeleeSettings::bDualWieldKnife in Source/Trace/Gameplay/TraceMelee.h,
; and every source line that behaves differently carries the tag [DUALWIELD], so
; `grep -rn "\[DUALWIELD\]" Source/Trace` is the complete inventory.
;
;   True (v28-v30)                          False (SHIPPED SINCE v31 s1)
;   ------------------------------------    ------------------------------------
;   knife always in the off hand            knife is a weapon you swap to
;   melee on its own bind (right mouse)     mouse 1 swings when the knife is out
;   [row deleted by v29 s5 - see above]     keys are TraceInputActions::All()'s,
;                                             and since v31 s1 that is
;                                             1 pistol / 2 SMG / 3 knife
;   swinging locks out fire for the         no lockout (you could not shoot with
;     length of SwingAnimSeconds              the knife out anyway)
;   NO knife speed bonus, ever              the v12 s3 +22% ground / raised air,
;                                             now paid by the KNIFE SLOT itself
;   gun and knife both drawn                one weapon on screen at a time
;   bots keep the gun and stab in reach     bots swap to the knife to close
;
; *** IT DOES NOT TOUCH THE SMG. *** Spec v28 section 9 is a separate feature and
; survives the revert intact - reverting the knife does not revert the SMG. The
; SMG's own magazine survives it too: LiveClipOwner (v29 s5) decides the swap on
; WHICH GUN OWNS THE LIVE CLIP rather than on the route taken, so pistol -> knife
; -> SMG exchanges exactly once whether the middle state is called "stowed" or
; "the knife slot". That was the v29 fix and the revert does not undo it.
;
; WHAT IT COSTS TO FLIP, stated so nobody is surprised: the knife's damage, cone,
; cooldown, reach and carrier immunity are untouched in both positions. Weapon
; BINDS do move this time - not because of this key, but because v31 s1 asked for
; a new 1/2/3 layout; see Settings/TraceUserSettings.cpp for the ConfigId
; migration that drops the stale lines. Read the resolved answer back from a
; running game with Trace.Knife.DumpSettings, which prints this key, the cvar,
; the launch flag and which of the three won.
bDualWieldKnife=False

; ==============================================================================
; HEALTH REGENERATION (spec v13 section 1)
;
; Verbatim: "Add a healing timer. After 9 seconds without taking damage,
; characters' health slowly begins to regenerate. Taking damage stops this
; process immediately."
;
; THIS BLOCK IS THE ONE THAT DECIDES. It is layered over the C++ initialisers in
; Source/Trace/Gameplay/TraceHealthComponent.h at startup, so editing only the
; header would change nothing at runtime. Read the resolved values back from a
; running game with Trace.Health.DumpSettings, which prints the table value, any
; console override, and the seconds a full 0 -> MaxHealth heal takes.
;
; RegenDelaySeconds is the user's number, not a starting point. It is measured
; from damage that actually LANDED - a bullet dropped by carrier invulnerability
; is not damage taken and deliberately does not restart it.
;
; RegenRatePerSecond 10 is the [ASSUMPTION]: 0 -> 100 in ten seconds. In the
; units of the guns that oppose it, a body shot is 40 (three to kill), so this
; buys back one body shot per four seconds of not being shot; the 9s delay is
; what makes that a reward for disengaging rather than for winning a trade.
;
; The mid-fight arm is the CVar Trace.Health.Regen (1 shipped, 0 removes the
; mechanic so Trace.Health.RegenTest can be shown going RED). bRegenEnabled here
; is the designer's switch and both have to agree for regen to run.
; ==============================================================================
[/Script/Trace.TraceHealthSettings]
bRegenEnabled=True
RegenDelaySeconds=9.000000
RegenRatePerSecond=10.000000

; ==============================================================================
; SPEC v29 SECTION 2a - THE PISTOL'S THREE DAMAGE NUMBERS (Trace Damage Zones)
; ==============================================================================
; *** LegDamage 30 -> 25. THE OWNER HAS ANSWERED THE OPEN QUESTION FROM DEMO 24
; AND THE ANSWER IS 25. ***
;
; Every spec damage table since section 6 has printed the pistol as 100/40/25
; while UTraceDamageSettings::LegDamage shipped 30. The v28 section 9 harness
; found the contradiction and deliberately asserted NEITHER number rather than
; bake a guess into a test. It is resolved now, in favour of the tables, and
; Trace.Weapons.V29 asserts 25.
;
; *** THIS WHOLE SECTION IS NEW AND THAT IS ITSELF A FIX. *** UTraceDamageSettings
; is `config = Game, defaultconfig` and had NO section in this file at all, so the
; game's three most-read numbers lived only in the C++ header - exactly the "a
; combat knob in only one of the two files" drift this project has paid for
; before, and the reason the v28 comments above could describe the pistol as
; "100/40/25" for a whole pass while the running game paid 30 on a leg.
;
; WHAT RELIED ON 30: nothing. The readers are FTraceHitZoneModel::DamageForZone
; (the shot itself), the kill feed's head-shot inference in UI/TraceKillFeed.cpp
; (which reads BodyDamage ONLY - the leg number never enters it), and the dumps.
;
; THE FOUR-SHOT LEG KILL SURVIVES EXACTLY: 4 x 25 = 100 = MaxHealth, so the fourth
; round is still fatal, now with nothing to spare. What is traded away is the
; narrowing the previous pass bought: the body-versus-leg payout swing widens from
; 25% back to 38%, which is the "inconsistent" feeling that pass was answering.
; Said out loud so it is a decision and not a surprise. The two levers if it comes
; back are HipHeightFraction (move the boundary out from under where shots land)
; and this number.
;
; THE ZONE GEOMETRY IS UNCHANGED and is seeded here for the same reason the damage
; is: so that the ini, not the header, is where these are edited from now on.
; Read them back from a running game with Trace.Smg.Dump, which prints the
; resolved pistol table beside the SMG's.
[/Script/Trace.TraceDamageSettings]
HeadDamage=100.000000
BodyDamage=40.000000
LegDamage=25.000000
HipHeightFraction=0.460000
HeadCenterHeightFraction=0.905000
HeadRadiusFraction=0.082000

; ==============================================================================
; SPEC v26 §9 — TRACE AUDIO (Project Settings > Game > Trace Audio)
; ==============================================================================
; UTraceAudioSettings is a UDeveloperSettings, so this is the section its
; UPROPERTY(config) knobs load from and the section the editor writes back to.
; It is seeded here for the house rule this project has paid for twice: the ini
; BEATS header defaults, so a knob that exists only in the header is one an
; owner can move in the editor and then lose on the next fresh clone. These
; values are the shipped tuning and are identical to the header's, which is the
; point — the ini is the place they are now edited, and the header is the
; fallback for a build with no config at all.
;
; WorldFalloffScale IS A MULTIPLE OF WorldInnerRadiusUU, NOT A DISTANCE. That
; is the standing rule about values that modify a base: at 1200 x 5 the audible
; edge is 6000 uu, and moving the inner radius moves the edge with it instead of
; leaving a stale absolute behind. UTraceAudioSettings::GetWorldFalloffDistanceUU()
; derives the distance and nothing stores it.
;
; bSoundEffectsEnabled is a master mute that silences every call site without
; unwiring one. SoundBankPath is left empty on purpose: empty means "use the
; convention path", which is what Scripts/import-sounds.sh writes to. Point it
; at a second bank asset to swap the whole set at once.
; ==============================================================================
[/Script/Trace.TraceAudioSettings]
bSoundEffectsEnabled=True
MasterVolume=1.000000
WorldInnerRadiusUU=1200.000000
WorldFalloffScale=5.000000

; ------------------------------------------------------------------------------
; SPEC v29 §1b — FOOTSTEPS: THEIR OWN VOLUME, AND THEIR OWN STRIDE
; ------------------------------------------------------------------------------
; FootstepVolumeScale IS A MULTIPLE OF MasterVolume, NOT A LEVEL. Standing rule
; again: turn the master down and the footsteps go down with it, instead of an
; absolute 0.15 quietly becoming the LOUDEST thing in the game the first time
; somebody sets the master to 0.1.
;
; *** 0.15 IS A MEASURED NUMBER, NOT A FEEL. *** The eleven footstep WAVs are not
; quiet files. From the samples themselves (Scripts/import_sounds.py prints this,
; Trace.Audio.Loudness asserts it from the imported asset, and the two agree):
;
;     loudest footstep    Step2         -20.06 dBFS peak
;     quietest other      ButtonPress   -27.21 dBFS peak
;
; So AT EQUAL GAIN THE FOOTSTEPS ARE THE LOUDER OF THE TWO by 7.15 dB, and any
; knob picked by ear could easily have shipped §1b broken with every report
; saying it was done. 0.15 is -16.48 dB, which puts the loudest footstep 9.33 dB
; under the quietest other sound. Trace.Audio.Loudness requires 6 dB (half the
; amplitude) and its RED ARM is `Trace.Audio.FootstepVolume 1`, which must FAIL.
;
; A STRIDE IS A DISTANCE, NOT A TIMER (FootstepStrideUU). A timer steps at the
; same rate whether you are sprinting or shuffling out of cover, which is exactly
; the information a footstep is supposed to carry.
FootstepVolumeScale=0.150000
FootstepStrideUU=175.000000
FootstepMinSpeedUU=60.000000

; ------------------------------------------------------------------------------
; SPEC v31 §3 — "The footsteps don't seem to be in the game - if they are raise
; the volume by 5db"
; ------------------------------------------------------------------------------
; *** THEY WERE IN THE GAME. *** Measured before anything changed, practice range,
; sound ON, from the player's own machine:
;
;     TraceCharacter_0 walked 2132 uu in 3.0 s -> 12 footsteps (12.2 were due at
;     the 175 uu stride).  11 of 11 clips game-side.  Multicasts sent: 220.
;
; So the trigger, the stride, the randomiser and the multicast were all alive and
; the owner still could not hear them, because the LEVEL was the problem: the
; loudest clip reached the engine at -36.53 dBFS effective peak and the quietest
; at -43.94, against -7.63 for a pistol shot. Trace.Audio.FootstepWalk is the
; end-to-end instrument that establishes this from the player's own viewpoint
; (steps announced -> Step* plays that REACHED the local engine -> the gain and
; the effective dBFS), and it is what should be re-run if this is ever doubted.
;
; *** THE BOOST IS A dB OFFSET ON FootstepVolumeScale, NOT A NEW ABSOLUTE. ***
; Standing rule, same as WorldFalloffScale above. 0.15 is v29 §1b's measured base
; and it is UNCHANGED; +5 dB is x1.7783, so the gain that reaches the engine is
; 0.15 x 1.7783 = 0.2667. Set FootstepVolumeBoostDb=0 to revert exactly.
;
; WHAT IT COSTS: the margin under the quietest other sound (ButtonPress,
; -27.21 dBFS) falls from 9.33 dB to 4.32 dB. Footsteps are still the quietest
; thing in the game and still ~24 dB under a gunshot, so §1b's "audibly quieter"
; still holds — but Trace.Audio.Loudness's threshold had to move from 6.0 dB to
; 4.0 dB to say so. That is written up on RequiredMarginDb in
; Source/Trace/Audio/TraceAudioLoudness.cpp. The harness's RED ARM still goes red
; (Trace.Audio.FootstepVolume 1 -> footsteps 7.15 dB LOUDER than ButtonPress).
FootstepVolumeBoostDb=5.000000

; ------------------------------------------------------------------------------
; SPEC v29 §1c — THE PISTOL LADDER'S RESET, AND WHY IT HAS A FLOOR
; ------------------------------------------------------------------------------
; "After a .3second break from shooting, reset the sounds back to pistol 1."
; PistolLadderResetSeconds is that number, kept literally, measured from the LAST
; SHOT rather than from the trigger release.
;
; *** ON ITS OWN IT WOULD MAKE §1c UNREACHABLE. *** The pistol's FireInterval is
; 0.315789 s (190 RPM, spec v24 §4) and 0.3 < 0.3158, so EVERY shot — even with
; the trigger held flat out — arrives more than 0.3 s after the previous one. The
; ladder would reset on every round, PistolShoot2/3/4 would never be heard, and
; the feature would ship as dead code.
;
; So the window has a FLOOR EXPRESSED AS A MULTIPLE OF THE GUN'S OWN INTERVAL —
; the standing rule, applied to the case it exists for, since "a break from
; shooting" only means anything in units of how often the gun shoots:
;
;     effective = max(0.300, 0.315789 x 1.25) = 0.395 s
;
; 1.25 rather than 1.05 because the window must clear the interval PLUS the
; jitter in when a shot is observed (up to a frame, and a frame under load in
; this project has been measured at 75 ms). Raise the fire rate and the window
; follows it down; drop it and the window follows it up.
;
; SET THE FLOOR TO 0 FOR THE LITERAL SPEC. Trace.Audio.GunLadder then reports
; every shot as PistolShoot1 and FAILs, which is that harness's red arm and the
; demonstration that this collision is real rather than a story in a comment.
PistolLadderResetSeconds=0.300000
PistolLadderResetIntervalFloor=1.250000
