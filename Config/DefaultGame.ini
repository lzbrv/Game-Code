; 1000 -> 1250 -> 1118 across spec v16 section 0. The doc asked to "increase the
; DISTANCE which Chut's bash knocks players by 25%" and this key is a SPEED; 1250 was
; the naive +25% on the speed and section 0 flagged it for measurement instead of
; shipping it. Trace.Move.AuditV16.Bash measured it twice, in two separate worlds,
; through the shipped TryBash with the victim frozen:
;   run A  1000 -> air 584.2 / total  875.6 | 1250 -> air 907.1 / total 1452.0
;   run B  1000 -> air 647.8 / total 1530.4 | 1103 -> air 779.4 / total 1776.8
; +25% speed bought +65.8% distance, so 1250 had to go.
;
; TUNED ON THE AIRBORNE LEG, because it is the only reproducible part. At the SAME
; 1000 uu/s the two runs agree on the air leg to 11% but differ by 75% on the TOTAL -
; the ground slide after touchdown was 291 uu in one world and 883 uu in the other,
; because it depends on where the bash happened rather than on this key. Its fitted
; exponent swung 2.267 -> 1.523 between runs. The air leg is the one with a closed
; form, d_air = (2 x ChutBashUpBias / g) x Speed^2, so this is the quadratic solve:
; 1000 x sqrt(1.25) = 1118 uu/s.
