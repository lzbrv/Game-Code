; WHAT 1118 ACTUALLY DELIVERS, MEASURED: +21.5% and +22.8% on the airborne leg over
; two runs, against the +25% asked. It lands a little under because the victim is
; launched from standing height and lands on the floor, so the arc is asymmetric and
; the fitted exponent sits below 2 - but that exponent came out 1.74 / 1.84 / 1.89 /
; 1.97 across four samples, so solving for it recommends 1103 / 1126 / 1133 / 1158
; depending on which sample you took. 1118 is the value that does not depend on the
; sample; chasing the last two points is fitting noise.
;
; It does NOT promise a uniformly +25% TOTAL knock - the ground bleed is terrain's to
; decide and no single speed can fix it. Re-measure before moving this, read the
; AIRBORNE LEG line rather than the total, and take more than one sample.
