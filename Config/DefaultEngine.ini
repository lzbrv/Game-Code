; ============================================================================
; Trace - engine configuration
;
; Keep this file portable: no absolute paths, nothing machine-specific, nothing
; that differs between macOS and Windows. Every value here is checked in and
; shared by the whole team.
;
; Where things live (UE reads each UCLASS from the ini named by its `config=`
; specifier, NOT from whichever file you happen to type it in):
;   UInputSettings   -> config=Input -> Config/DefaultInput.ini
;   UTraceSettings   -> config=Game  -> Config/DefaultGame.ini
; Both are cross-referenced below so nobody hunts for them.
; ============================================================================

; ----------------------------------------------------------------------------
; Maps and game modes
;
; There are THREE levels:
;   /Game/Maps/MainMenu     the title screen. Empty; ATraceMenuHUD draws every
;                           pixel. Produced by Scripts/generate_map.py.
;   /Game/Maps/Arena        the PROCEDURAL match level. Also empty - everything
;                           in it is built in C++ by ATraceArenaBuilder at
;                           BeginPlay. Produced by Scripts/generate_map.py.
;   /Game/Maps/Arena_Baked  the SAME arena, run once and written down as ~572
;                           real, clickable, movable actors with One File Per
;                           Actor on. Produced by Scripts/bake-arena.sh.
;                           This is the one a designer can open and edit.
;
; ============================================================================
; SPEC v17 SECTION 2 - PROMOTING THE BAKED ARENA. READ BEFORE CHANGING A MAP KEY.
; ============================================================================
; "The map you can edit is the map you ship." ServerDefaultMap below moved from
; /Game/Maps/Arena to /Game/Maps/Arena_Baked. That is THE setting; there is one
; of it and it is the line marked PROMOTED further down.
;
; TO GO BACK, change exactly one line:
;     ServerDefaultMap=/Game/Maps/Arena
; and nothing else. /Game/Maps/Arena is untouched, still procedural, still
; builds itself at BeginPlay, and is still reachable at any time by naming it:
;     Scripts/run-listen-server.sh --map /Game/Maps/Arena
;     UnrealEditor Trace.uproject /Game/Maps/Arena -game
; The two are meant to be A/B'd against each other and always have been.
;
; WHAT THIS KEY DOES AND DOES NOT REACH, stated plainly so nobody is surprised:
;   REACHED    a dedicated server started with no map on its command line.
;   NOT REACHED (they name a map explicitly, which always wins over any ini):
;              Scripts/run-listen-server.sh   -> Scripts/_trace_common.sh's
;                                                TRACE_DEFAULT_MAP
;              the title screen's PLAY button -> TraceMaps::Arena, a compile-time
;                                                constant in
;                                                Source/Trace/UI/TraceMatchOptions.h
;              a packaged build's cook list   -> Config/DefaultGame.ini MapsToCook
; Those three are one-line changes in files this pass does not own; until they
; are made, the title screen still hosts the PROCEDURAL arena. Both maps play
; identically - that is the entire premise of the bake - so nothing is broken
; either way, but "which arena am I in" is answered by the [Arena] lines in the
; log: a baked level logs "Baked level adopted, nothing built: N baked pieces".
;
; IF THE BAKED MAP IS MISSING (a fresh clone that has not run `git lfs pull`,
; so Content/Maps/Arena_Baked.umap is still a 130-byte LFS pointer) the engine
; cannot fall back on its own - it will fail to load the level and the server
; will exit. Run `git lfs pull`, or set the key back to /Game/Maps/Arena.
; ============================================================================
;
; SPEC v13 §4 - "The game should default to opening the main menu level."
;
; ALL THREE KEYS BELOW NOW SAY SO, and the one that changed is EditorStartupMap.
; GameDefaultMap was ALREADY the menu, so a packaged or standalone launch already
; presented a title screen rather than dropping the player into a match in
; progress - that half was never broken. EditorStartupMap was /Game/Maps/Arena,
; justified by "that is what anyone opening the editor is here to work on", and
; THAT is what the report is about: the editor opens the arena, Play-in-Editor
; plays whatever level is open, so pressing Play went straight into a match and
; the menu was never seen. The old justification is deleted rather than left
; sitting above a key that now contradicts it.
;
; ServerDefaultMap stays on AN arena, and that is not an oversight: a dedicated
; server has nobody to show a menu to, and a headless process sitting on a title
; screen would accept no players. Which arena it is, is spec v17 section 2's
; promotion - see the block above.
;
; HOW EACH KEY IS ACTUALLY REACHED, so this can be verified rather than argued:
;   GameDefaultMap    UEngine::Browse, when a launch supplies no map on the
;                     command line. Standalone and packaged.
;   EditorStartupMap  FEditorFileUtils::LoadDefaultMapAtStartup, at editor boot.
;                     PIE then plays the level that is open, which is why this
;                     key decides what the Play button does.
;   ServerDefaultMap  the dedicated-server path only.
; Trace.DumpSettings prints all three FROM THE RUNNING GAME, with a verdict line
; for the two that matter here - the ini is layered (Base, then this file, then
; any local override), so this file is not the final word and must not be read
; as if it were.
;
; ONE LOCAL SETTING CAN STILL OVERRIDE THE EDITOR HALF, and it is worth knowing
; about before someone concludes this line does nothing: Editor Preferences >
; Loading & Saving > "Load Level at Startup". At its shipped value (ProjectDefault,
; set by BaseEditorPerProjectUserSettings.ini) EditorStartupMap is what loads. If a
; collaborator sets it to "Last Opened", the editor loads [EditorStartup] LastLevel
; from their own Saved/Config instead and this key is ignored for them. That is a
; per-user preference in a gitignored file, so it cannot be pinned from here.
;
; How each map finds its game mode (UGameInstance::CreateGameModeForURL order:
; ?game= option, then the map's WorldSettings, then GameModeMapPrefixes, then
; GlobalDefaultGameMode):
;   MainMenu -> GameModeMapPrefixes below, matched on the "MainMenu" prefix.
;   Arena    -> GlobalDefaultGameMode.
; The prefix table is what keeps the menu map a genuinely empty, regenerable
; file: a per-map DefaultGameMode override would have to be saved INSIDE the
; binary .umap, which is exactly the kind of hidden state this project builds
; everything in C++ to avoid.
; ----------------------------------------------------------------------------

[/Script/EngineSettings.GameMapsSettings]
; spec v13 §4: /Game/Maps/Arena -> /Game/Maps/MainMenu. This is the key that makes
; pressing Play in the editor land on the menu instead of skipping it.
EditorStartupMap=/Game/Maps/MainMenu
GameDefaultMap=/Game/Maps/MainMenu
; PROMOTED (spec v17 section 2): was /Game/Maps/Arena. Revert this ONE line to go
; back. Read the block at the top of this section first.
ServerDefaultMap=/Game/Maps/Arena_Baked
GlobalDefaultGameMode=/Script/Trace.TraceGameMode
GlobalDefaultServerGameMode=/Script/Trace.TraceGameMode
TransitionMap=
bUseSplitscreen=False
+GameModeMapPrefixes=(Name="MainMenu",GameMode="/Script/Trace.TraceMenuGameMode")
; Lets you write `?game=Trace` in a travel URL or on the dedicated-server command line:
;   TraceServer /Game/Maps/Arena?game=Trace -log
+GameModeClassAliases=(Name="Trace",GameMode="/Script/Trace.TraceGameMode")
+GameModeClassAliases=(Name="TraceMenu",GameMode="/Script/Trace.TraceMenuGameMode")

; ----------------------------------------------------------------------------
; Game framework classes.
;
; ATraceGameMode's constructor sets GameStateClass / PlayerStateClass /
; PlayerControllerClass / DefaultPawnClass / HUDClass (SpectatorClass is left at
; the engine default). Those properties are NOT config-marked on AGameModeBase,
; so they cannot be set from any ini - do NOT add a [/Script/Trace.TraceGameMode]
; block here expecting it to work. It would read as live configuration, silently
; do nothing, and send the next person hunting for a bug in the class. The
; constructor is the only place these can be changed.
; ----------------------------------------------------------------------------

; ----------------------------------------------------------------------------
; Networking - net driver
;
; 60 Hz server tick is the target for a hitscan shooter; the lag-compensation
; history buffer (UTraceSettings.LagCompHistoryDuration = 1s) is sized assuming
; roughly this rate. The client rates are raised well above the 15 KB/s engine
; default because we replicate a per-carrier trail as well as 10 characters.
; ----------------------------------------------------------------------------

[/Script/Engine.Engine]
; ClearArray wipes BOTH definitions inherited from BaseEngine.ini, so DemoNetDriver
; has to be restored here as well - without it replay recording (demorec /
; StartRecordingReplay) fails with "Couldn't find NetDriverDefinition".
; DriverClassNameFallback repeats the plugin class on purpose, exactly as stock
; BaseEngine.ini does. There is NO /Script/Engine.IpNetDriver - UIpNetDriver lives
; in the OnlineSubsystemUtils module, not in Engine. Naming a non-existent engine
; class here is not a safety net, it is a guaranteed failure: measured, a headless
; "-server" run logged
;   LogUObjectGlobals: Warning: Failed to find object 'Class /Script/Engine.IpNetDriver'
;   LogNet: Error: LoadMap: failed to Listen(/Game/Maps/Arena)
; and came up with no net driver at all, so nothing could ever connect. With the
; line as it stands the same run logs "IpNetDriver listening on port 7777".
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")
; Frame-rate smoothing lies to DeltaTime, which is poison for client prediction.
bSmoothFrameRate=False
bUseFixedFrameRate=False

; ----------------------------------------------------------------------------
; Video settings class (spec v11 s1)
;
; UEngine::CreateGameUserSettings news up whatever class this names and hands it
; back from GEngine->GetGameUserSettings(). Without this line the engine builds a
; plain UGameUserSettings, UTraceGameUserSettings::Get() returns null, and every
; row on the VIDEO page silently does nothing - Get() logs an Error saying exactly
; that if it ever happens again.
;
; The property is `globalconfig` on UEngine, which sounds like it should not be
; readable from a project ini and is: globalconfig only means "one value for the
; whole class rather than per-object", and the Engine ini hierarchy that supplies
; it includes this file. It is also ConfigRestartRequired - the class is chosen
; once, at engine init.
;
; UTraceUserSettings (controls, sensitivity, keybinds) is NOT involved here and is
; not merged into it. Two classes, two inis, two jobs.
GameUserSettingsClassName=/Script/Trace.TraceGameUserSettings

[/Script/OnlineSubsystemUtils.IpNetDriver]
NetServerMaxTickRate=60
MaxClientRate=100000
MaxInternetClientRate=100000
InitialConnectTimeout=120.0
ConnectionTimeout=60.0
KeepAliveTime=0.2
RelevantTimeout=5.0
SpawnPrioritySeconds=1.0
ServerTravelPause=4.0
NetConnectionClassName="/Script/OnlineSubsystemUtils.IpConnection"
AllowPeerConnections=False

[/Script/Engine.Player]
ConfiguredInternetSpeed=100000
ConfiguredLanSpeed=100000

; ----------------------------------------------------------------------------
; Networking - movement correction tuning (AGameNetworkManager)
;
; MaxMoveDeltaTime caps how much simulation a single client move may claim, which
; is the primary defence against speed-hack style timestamp inflation.
; MAXPOSITIONERRORSQUARED is the squared distance (uu^2) beyond which the server
; corrects the client. Dash is 3000 uu/s (UTraceSettings.DashSpeed, raised from
; 2600 this pass), so a too-tight threshold would fight legitimate predicted
; dashes; the engine default of 3.0 is kept deliberately - raise it only with a
; measured reason.
; ----------------------------------------------------------------------------

[/Script/Engine.GameNetworkManager]
MaxMoveDeltaTime=0.125
MaxClientSmoothingDeltaTime=0.50
ClientNetSendMoveDeltaTime=0.0166
ClientNetSendMoveDeltaTimeThrottled=0.0222
ClientNetSendMoveDeltaTimeStationary=0.0166
ClientNetSendMoveThrottleAtNetSpeed=10000
ClientNetSendMoveThrottleOverPlayerCount=10
ClientAuthorativePosition=False
ClientErrorUpdateRateLimit=0.0
MAXPOSITIONERRORSQUARED=3.0
MAXNEARZEROVELOCITYSQUARED=9.0
CLIENTADJUSTUPDATECOST=180.0
MAXPOSITIONDIFFERENCESQUARED=1600.0
MAXVELOCITYDIFFERENCESQUARED=400.0
MAXCLIENTUPDATEINTERVAL=0.25
MoveRepSize=42.0
TotalNetBandwidth=1000000
MinDynamicBandwidth=8000
MaxDynamicBandwidth=100000
; Time-discrepancy detection compares client-claimed move time against real server
; time. Leave detection on and resolution off for the prototype: resolution
; retroactively slows the offender and is very confusing while tuning movement.
bMovementTimeDiscrepancyDetection=True
bMovementTimeDiscrepancyResolution=False

; ----------------------------------------------------------------------------
; Input
;
; Enhanced Input is enabled by pointing the default player input / input component
; classes at the EnhancedInput plugin classes. Those properties live on
; UInputSettings (config=Input) and are therefore set in Config/DefaultInput.ini,
; not here. All actions and the mapping context are built in C++ by
; ATracePlayerController - there are no input .uassets in this project.
; ----------------------------------------------------------------------------

; ----------------------------------------------------------------------------
; Rendering
;
; The prototype runs from an empty level using only /Engine/BasicShapes meshes and
; a single directional + sky light spawned by ATraceArenaBuilder. Nanite, Lumen and
; virtual shadow maps buy us nothing here and cost a great deal on the Apple Silicon
; Metal path (SM6 is M2+ only), so they are off. Turn them back on deliberately if
; the project ever gets real art.
;
; ONE macOS SOFTNESS SOURCE IS NOT FIXABLE FROM HERE, so do not go hunting for it:
; a standalone -game window on a Retina display renders at POINT resolution and lets
; the OS scale it up to device pixels. FMacPlatformApplicationMisc's
; IsHighDPIModeEnabled() ends in "&& GIsEditor" (Engine/Source/Runtime/
; ApplicationCore/Private/Mac/MacPlatformApplicationMisc.cpp), and FMetalViewport
; sizes its CAMetalLayer drawable by exactly that DPI factor, so outside the editor
; the factor is 1.0 no matter what. Setting bAllowHighDPIInGameMode=True does
; nothing on Mac: FSlateApplication::InitHighDPI calls
; FPlatformApplicationMisc::SetHighDPIMode(), which Mac never overrides.
; Consequence: on this 1728x1117-point / 3456x2234-pixel display, every game window
; is being doubled by the compositor. That is why the settings below matter more
; here than they would on Windows - the frame we hand the OS is the sharpest thing
; the user will ever see, so it must not ALSO be internally upscaled.
; ----------------------------------------------------------------------------

[/Script/Engine.RendererSettings]
r.Nanite.ProjectEnabled=False
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Shadow.Virtual.Enable=0
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.AllowStaticLighting=False
; MESH DISTANCE FIELDS: ON, AND THIS IS THE ONE LINE THAT MAKES "EPIC" MEAN LUMEN.
;
; Lumen's software ray tracing traces against mesh distance fields. This arena is
; NOT Nanite and must not be (a few hundred 12-triangle instances; see the note in
; TraceArenaBuilder::ApplyFidelity), so there is no surface-cache-from-Nanite path
; either. With this False, ATraceArenaBuilder::ApplyFidelity REFUSES to arm Lumen at
; any quality level and logs why - because a Lumen that cannot reach a scene
; representation costs full price and lights nothing, which is precisely the "costs
; 4 ms and you cannot see it" outcome spec v11 §4 asks to be reported rather than
; shipped.
;
; TURNING IT ON DOES NOT TURN LUMEN ON. Distance fields are generated at cook/load
; and consumed only by a feature that asks for them; with GI below Epic nothing
; asks, no global distance field is updated per frame, and the frame is the one this
; project has always had. The Lumen gate itself is ArenaLumenMinGITier = 3 (Epic
; only), so the shipped HIGH default - which is also what this Mac gets, since the
; Metal synthetic benchmark is broken and auto-detect falls back to the default -
; stays exactly as expensive as it was. Spec v11 §0 forbids anything else.
;
; Restart-and-rebuild, not runtime: the meshes need their fields built.
r.GenerateMeshDistanceFields=True
r.CustomDepth=3
r.Mobile.ShadingPath=0

; --- Image sharpness ---------------------------------------------------------
;
; Everything below exists because the game read as soft/blurry. Each cause was
; measured from matched screenshots (same build, same camera, -RenderOffScreen so
; nothing can nudge the view), not guessed. Net effect of the whole block, mean
; |Laplacian| of luminance over the frame with the HUD strips excluded:
;   +26% detail, and 46% LESS frame-to-frame grain in the dark floor.
; Every key in this section is pushed to the matching console variable at startup by
; UE::ConfigUtilities::ApplyCVarSettingsFromIni(".../RendererSettings", ...,
; ECVF_SetByProjectSetting), so plain r.* names that are not UPROPERTYs of
; URendererSettings (r.Tonemapper.Sharpen, r.SSR.Temporal) work here too and
; OUTRANK ANYTHING SCALABILITY SETS. That last part is a loaded gun: any CVar the
; scalability groups also drive becomes read-only the moment it is listed here, and
; the failure is silent. It cost this project the entire resolution-scale setting
; once already - see the r.ScreenPercentage note further down. Before adding a key
; to this section, check it does not appear in Engine/Config/BaseScalability.ini.

; 4 = TSR (AAM_TSR; 0 None, 1 FXAA, 2 TemporalAA, 3 MSAA, 4 TSR, 5 SMAA).
;
; This was 2 (TAA). TAA blends this frame with an exponential history, which on a
; scene made almost entirely of one-pixel-wide emissive lines does not just soften
; edges - it deletes geometry. Measured at 1600x900 from a fixed camera: the thin
; horizontal rail trim on the far side of the arena is ABSENT under TAA and fully
; resolved under TSR; where TAA gives one fat fuzzy band the same pixels under TSR
; are three separate lines. In frame statistics, holding resolution at 100% and
; changing only the AA method was worth +21% detail (TAA 100% +4.1% vs TSR 100%
; +26.5%, both against TAA at the engine's auto resolution).
;
; TSR is supported on this platform, not emulated: Engine/Config/Mac/
; DataDrivenPlatformInfo.ini declares bSupportsGen5TemporalAA=true for both
; METAL_SM5 and METAL_SM6, and the runs above log rhifeaturelevel="SM6",
; shaderplatform="METAL_SM6".
;
; NOT FXAA (1): it is spatial-only, so the glowing grid would crawl and shimmer
; whenever the camera moves, which is worse than softness for this art direction.
r.AntiAliasingMethod=4

; Render at native resolution. This is a fix, not a formality.
;
; r.ScreenPercentage defaults to 0, which does NOT mean 100 - it means "ask
; FStaticResolutionFractionHeuristic", and on desktop that heuristic defaults to
; EScreenPercentageMode::BasedOnDisplayResolution, which lerps the rendering
; resolution DOWN as the output resolution goes UP using the
; [Rendering.AutoScreenPercentage] curve in BaseEngine.ini. Measured with
; ProfileGPU in a 1600x900 window: the scene was rendering at 1336x751 (83.5%) and
; being upscaled. The bigger the window, the worse it gets - about 75% at 1728x1117,
; ~61% at 1440p. That is a resolution drop nobody asked for on a machine that is
; nowhere near GPU-bound here.
;
; THE FIX IS NOW THE Default/Desktop.Mode PAIR ALONE, AND r.ScreenPercentage ITSELF
; MUST NOT BE SET HERE. Spec v11 s1/s2.3.
;
; This block used to also carry "r.ScreenPercentage=100". That silently disabled the
; entire resolution-scale setting, which on a per-pixel-bound frame is the single
; most effective performance dial the game has. Everything in
; [/Script/Engine.RendererSettings] is pushed at ECVF_SetByProjectSetting
; (0x04000000); Scalability::SetResolutionQualityLevel writes r.ScreenPercentage at
; ECVF_SetByScalability (0x02000000), which is WEAKER, so every write from
; UTraceGameUserSettings::SetResolutionScalePercent was discarded by the console
; manager without a word.
;
; Leaving r.ScreenPercentage at its own default of 0 loses nothing, because 0 does
; not mean 0% - it means "ask FStaticResolutionFractionHeuristic", and the two keys
; below are precisely what that heuristic reads:
;     PullRunTimeRenderingSettings: override <= 0 -> Mode = Desktop.Mode (0 = Manual)
;                                                    fraction = Default / 100
; so Manual + 100 still pins rendering at native and the BasedOnDisplayResolution
; auto-downscale (the 83.5%-at-1600x900 bug this block was written for) still cannot
; come back. The difference is that scalability can now write the CVar, so 50-100%
; render scale actually reaches the renderer.
;
; If you ever need to force a scale from config again, set r.ScreenPercentage.Default,
; never r.ScreenPercentage.
r.ScreenPercentage.Default=100
r.ScreenPercentage.Default.Desktop.Mode=0

; Modest post-tonemap sharpen. -1 (the default) means "inherit from the
; PostProcessVolume", which is 0. 0.7 restores the micro-contrast that any temporal
; accumulator costs you, without the white haloing that starts to show around the
; neon trim above ~1.0. Sharpening is applied after TSR upscales, so it works on
; final-resolution pixels.
;
; Measured, same camera, mean |Laplacian| against the old settings, with TSR and
; 100% screen percentage already on in every case:
;   sharpen 0.0 +18.6%   0.4 +30.1%   0.7 +40.7%   1.0 +54.2%
; and 1.0 is where a dark overshoot rim becomes visible along the big cyan
; uprights, so 0.7 is the last clean step, not an arbitrary pick.
r.Tonemapper.Sharpen=0.7

; Temporal filter on screen-space reflections. Engine default is 0.
;
; This is a consequence of the two settings above, not an independent idea. The
; floor is a glossy near-black surface carrying strong SSR (the arena builder sets
; ScreenSpaceReflectionIntensity=70), and SSR is stochastic: it was always noisy,
; TAA was simply smearing the noise away. A sharper pipeline shows it - measured
; grain in a flat patch of dark floor went up 82% going from TAA to TSR+sharpen.
; Turning this on takes that back down (-35% spatial, -46% frame-to-frame) and
; costs no geometry: at 4x zoom the thin neon lattices are pixel-identical with it
; on and off, only the sand on the floor changes.
r.SSR.Temporal=1

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
